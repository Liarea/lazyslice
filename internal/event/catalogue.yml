# Code catalogue (ARCHITECTURE.md §7).
#
# Every event.Code emitted anywhere in the tree must have a row here; CI fails
# on a code in the tree the catalogue does not carry (internal/event/event.go).
# docs/ERRORS.md is generated from this file by tools/docgen.
#
# Row shape:
#   code:    the event.Code string, dotted "<subject>.<verdict>.<detail>".
#   kind:    one of the event.Kind names (ARCHITECTURE.md §7) — stage_start,
#            stage_done, progress, decision, question, info, warn, error.
#   stage:   the event.Stage name the code is emitted from.
#   exit:    the process exit code (ADR-005), present only for kind: error.
#   message: the rendered template. Placeholders are {argkey}, drawn only
#            from event.ArgKey — a test asserts no template references a key
#            outside that enum. Never a value from a row.
#   args:    the ArgKey names the template uses, for that test to check
#            against.
#
# Scaffold status: only the three codes ADR-008 adds are listed below. The
# rest arrive with the tasks that emit them (internal/event/event.go).

- code: target.refused.unreachable
  kind: error
  stage: discover
  exit: 4
  message: "target {host} did not respond: {reason}"
  args: [host, reason]

# T-0327 (dogfood session 2): the server answered and refused the password
# (SQLSTATE 28P01). It used to be target.refused.unreachable, which said "did
# not respond" and rendered the driver's raw line as the whole reason.
- code: target.refused.auth
  kind: error
  stage: discover
  exit: 4
  message: "target {host} refused the password for role {role} (SQLSTATE 28P01): put it in the --target connection string, $PGPASSWORD or ~/.pgpass, or pass --password-command"
  args: [host, role]

- code: target.refused.missing
  kind: error
  stage: discover
  exit: 4
  message: "no target: pass {flag} postgres://..."
  args: [flag]

- code: target.refused.no_create
  kind: error
  stage: discover
  exit: 4
  message: "role {role} may not create objects in {database}: {statement}"
  args: [role, database, statement]

- code: target.refused.start_timeout
  kind: error
  stage: discover
  exit: 4
  message: "target container {container} did not become ready after {seconds}s: docker logs {container}"
  args: [container, seconds]

# The five gate refusals internal/pg declares (internal/pg/target.go) and could
# not record here, because internal/event/catalogue.yml was not a file that
# task's paths allowed it to write (internal/pg/CLAUDE.md, "Decisions made
# during implementation"). The exit codes are the ones ARCHITECTURE.md §9
# assigns each rule: identity is exit 2, every other refusal is exit 4.

- code: target.refused.same_database
  kind: error
  stage: discover
  exit: 2
  message: "target {database} on {host} is the source database"
  args: [database, host]

- code: target.refused.remote
  kind: error
  stage: discover
  exit: 4
  message: "target {host} is not on this machine: pass {flag} to write to it"
  args: [host, flag]

- code: target.refused.table_cap
  kind: error
  stage: discover
  exit: 4
  message: "target {database} holds {count} user tables, more than lazyslice will check"
  args: [database, count]

# {table} is the occupied tables, sorted and capped at five; {reason} says why
# they stop the run — a copy of another source when lazyslice's own marker is
# there and not bound to this source — and names --target (T-0327: the row
# used to render with {table} unfilled and the table list as its reason).
- code: target.refused.not_empty
  kind: error
  stage: discover
  exit: 4
  message: "the target {database} is not empty ({table}): {reason}"
  args: [database, table, reason]

- code: target.refused.probe_failed
  kind: error
  stage: discover
  exit: 4
  message: "could not check the target {database}: {reason}"
  args: [database, reason]

# The run lease (ARCHITECTURE.md §11.2, THREAT_MODEL.md T2, both amended
# 2026-09-14). The gate's verdict is reached several stages before the first
# DROP acts on it, so one run holds the target for the whole of that interval
# with a session-level advisory lock on a key derived from the target database
# name, and a second run is refused here rather than allowed to pass a gate
# whose answer is about a database being taken apart underneath it.
#
# {reason} is the run id named in the holder's application_name, or the words
# "another lazyslice run" when the role may not read another session's
# application_name. A run id is an identifier, not a value (THREAT_MODEL.md T4).

# docs/ERRORS.md is generated from this file by tools/docgen, and docs/ was
# outside the paths of the task that added the four rows below and this one;
# tracker T-0148 is the regeneration.

- code: target.refused.lease_held
  kind: error
  stage: discover
  exit: 4
  message: "the target {database} is held by {reason}: one lazyslice run writes a target at a time"
  args: [database, reason]

# The classify stage (ARCHITECTURE.md §4). Classifier.Classify takes no
# event.Sink -- it is pure, and core.Run is the only producer -- so the codes
# below are declared in internal/classify/codes.go beside the results that
# produce them and emitted by core from a *pipeline.Classification.
#
# {reason} carries Decision.Reason, which is rendered from the fixed template
# set in internal/classify/reasons.go and parsed back by
# classify.ParseReason: it holds identifiers, category names, type families,
# a closed set of validator phrases and counts, and never a sampled value
# (THREAT_MODEL.md T4, ARCHITECTURE.md §2 "Value-free types").

# The mask-or-copy verdict is carried by the code and not by an argument:
# event.Args has no category or confidence key (internal/event/event.go), so a
# single "decided" code would leave a reader of the --json stream unable to tell
# a masked column from a copied one. internal/invariants/i2_masking_test.go is
# that reader, and its prefix lists ("classify.masked", "classify.copied") are
# where these two spellings come from.

- code: classify.masked.column
  kind: decision
  stage: classify
  message: "{table}.{column}: {reason}"
  args: [table, column, reason]

- code: classify.copied.column
  kind: decision
  stage: classify
  message: "{table}.{column}: {reason}"
  args: [table, column, reason]

# T-0325: dogfood session 1 read "classified fresh and masked at or above
# possible" for a column this run had actually copied (a boolean, decided
# below the mask threshold) — the line described the drift rule, not the
# decision the run just reached. {verdict} is that decision, "copied" or
# "masked as CATEGORY", the same way classify.masked.column and
# classify.copied.column already say it. This code is also only ever sent
# when a committed yml exists to be missing from (internal/core's
# classifyStage gates the whole loop on r.prior != nil); an --unmask flag
# with no such file used to build an in-memory prior the drift pass could
# not tell from a committed one, and printed this line for every column the
# flags did not name.
- code: classify.column.drift
  kind: warn
  stage: classify
  message: "{table}.{column} is not in {path}: classified fresh and {verdict}"
  args: [table, column, path, verdict]

# T-0321: dogfood session 1's own report — "1,845 reason lines scrolled past
# before each refusal ... nothing summarised either". Printed once, right
# after the last classify.masked.column/classify.copied.column line, only on
# a run with no committed yml to reuse (internal/core's CodeClassifySummary
# doc comment has the full account of when this fires instead of
# classify.reused below).
- code: classify.summary
  kind: info
  stage: classify
  message: "{column_count} column(s): {masked_count} masked, {copied_count} copied, {key_count} never-masked keys"
  args: [column_count, masked_count, copied_count, key_count]

# T-0321's other half: dogfood session 2 re-ran from a committed lazyslice.yml
# with zero drift and got the same 1,806 reason lines session 1 did. On a run
# that read a committed yml, the classify.masked.column/classify.copied.column
# lines above are still sent for every column, but internal/render.Lines skips
# one whose verdict matches what the yml already recorded (Event.Settled) —
# this line replaces the settled rest on the human transcript, with a
# changed_count naming how many of the yml's own decisions this run's
# re-derivation disagreed with (review finding 2), alongside drift_count for
# the columns the yml never saw at all.
- code: classify.reused
  kind: info
  stage: classify
  message: "{count} decisions from {path}, {drift_count} drift, {changed_count} changed"
  args: [count, path, drift_count, changed_count]

# An opt-out is not honoured when the column's type fingerprint has changed
# since it was recorded, and also when it records no fingerprint at all: an
# opt-out nothing can revoke is the fail-open version of THREAT_MODEL.md T3's
# control, so internal/classify treats it as expired rather than as permanent.
# pipeline.Classification.Expired still describes itself as the narrower set;
# that comment is owed the same widening.

- code: classify.column.opt_out_expired
  kind: warn
  stage: classify
  message: "the opt-out on {table}.{column} is not honoured: it records no type fingerprint, or the column's type changed"
  args: [table, column]

- code: classify.refused.strict_schema
  kind: error
  stage: classify
  exit: 10
  message: "{count} columns are not in {path} and {flag} is set"
  args: [count, path, flag]

# --mask TABLE.COL[=CATEGORY] (T-0319), or a `mask:` block in the committed
# yml, names a column the run cannot mask as asked: a key or generated column
# the classifier never masks, a type the category does not accept, a column
# --mask would move from one masker to another, or one whose foreign-key child
# would still be copied in clear (one event per such child). {flag} is
# "--mask" or "mask: in PATH"; {reason} is a fixed phrase naming the category,
# and the child column when there is one.
- code: classify.refused.mask
  kind: error
  stage: classify
  exit: 2
  message: "{flag} asks for {table}.{column} to be masked, and it cannot be: {reason}"
  args: [flag, table, column, reason]

# The plan stage (ARCHITECTURE.md §3). Planner.Plan takes no event.Sink -- it is
# pure, and core.Run is the only producer -- so the codes below are declared in
# internal/plan/codes.go beside the *plan.Refusal that carries them, and emitted
# by core from that error. Exit codes are ADR-005's table: 2 usage, 11 budget,
# 12 plan refused, 13 target schema not recreatable.
#
# {flag} carries a flag spelling with identifiers substituted, such as
# "--key public.click_stream=col,col or --skip-table public.click_stream". It is
# built from the table's own name and never from a row (THREAT_MODEL.md T4).

- code: plan.refused.no_root
  kind: error
  stage: plan
  exit: 2
  message: "{flag} names no table in the source"
  args: [flag]

- code: plan.refused.key_column
  kind: error
  stage: plan
  exit: 2
  message: "{flag} on {table} names {column}, which is not a column of it or is a system column: there is no ctid rung"
  args: [table, column, flag]

# {reason} carries the offending character or pair -- ";", "--", "/*", a
# backslash, a dollar sign, an unbalanced parenthesis -- and {count} its 1-based
# position in the predicate. Neither is a value and neither echoes the predicate
# text: THREAT_MODEL.md T5 withholds `where` literals, and punctuation is not a
# row (internal/plan/where.go).

- code: plan.refused.where_syntax
  kind: error
  stage: plan
  exit: 2
  message: "{flag} carries {reason} at character {count}: the source only accepts a predicate that stays one"
  args: [flag, reason, count]

- code: plan.refused.key_not_unique
  kind: error
  stage: plan
  exit: 12
  message: "{flag} does not identify a row in {table}: at least one key appears more than once"
  args: [table, flag]

- code: plan.refused.no_identity
  kind: error
  stage: plan
  exit: 12
  message: "{table} has no row identity: pass {flag}"
  args: [table, flag]

- code: plan.refused.unreadable
  kind: error
  stage: plan
  exit: 12
  message: "{role} cannot read {table}, which the slice needs as a parent: {statement}"
  args: [table, role, statement]

- code: plan.refused.skip_parent
  kind: error
  stage: plan
  exit: 12
  message: "{flag} cannot drop {table}: the slice needs it as a parent and would not be referentially complete without it"
  args: [table, flag]

- code: plan.refused.row_budget
  kind: error
  stage: plan
  exit: 11
  message: "{table} takes the slice past {count} rows: raise {flag}, or lower --take, --cap or --depth"
  args: [table, count, flag]

- code: plan.refused.memory_budget
  kind: error
  stage: plan
  exit: 11
  message: "{table} takes the estimated key and filter memory past {count} bytes: raise {flag}, or lower --take, --cap or --depth"
  args: [table, count, flag]

# {reason} carries the category the column is masked under and the type family
# its column has, in that order, because event.ArgKey has no key for either
# (internal/event/event.go) and the message is only actionable if it names both:
# the operator's fix is either an --unmask on the column or a rule change, and
# neither is choosable from a table and a column name alone. Both halves are
# identifiers -- a category from the rule pack and a type family from a fixed
# list -- and neither is a row (THREAT_MODEL.md T4). Owed to the task that can
# write internal/event/event.go: an ArgCategory and an ArgType, and this message
# re-templated onto them. T-0054's paths did not include that file.
#
# One column reaches this code by type alone and its {reason} reads differently:
# a **composite** (T-0094). No masker can write a record, so a masked composite
# is refused here rather than copied verbatim or discovered in the loader, and
# its {reason} names the composite type and the two escapes -- --skip-table for
# the table, or a reasoned --unmask for the column. Both are identifiers and a
# flag spelling built from them, the same borrowing plan.refused.no_identity
# makes in {flag}, and neither is a row.
#
# A second {reason} of the same shape is temporary: an **array whose values
# arrive from the source as one text literal** (T-0118). internal/transform
# masks an array element-wise only when the driver decoded it into a slice, so
# such a column would be masked as one scalar and die in the loader; the plan
# refuses it here instead and names the same two escapes. It goes when the
# element-wise masking of a literal lands.

- code: plan.refused.unwritable
  kind: error
  stage: plan
  exit: 12
  message: "{table}.{column} cannot be masked in place: {reason}"
  args: [table, column, reason]

# ARCHITECTURE.md §5's unique-index rule. {reason} carries d, d_required and the
# escapes, because the sentence has to name four numbers and two flags to be
# actionable and event.ArgKey has no keys for a domain or a category
# (internal/event/event.go) -- the same borrowing plan.refused.unwritable above
# makes, and owed to the same task. {count} is n, the planned row count of the
# table, which is the number the operator changes with --take or --cap.

- code: plan.refused.unique_domain
  kind: error
  stage: plan
  exit: 12
  message: "{table}.{column} is under a unique index and cannot be masked without collisions: {reason}"
  args: [table, column, count, reason]

# ARCHITECTURE.md §5's equality-group rule (the 2026-09-14 amendment, T-0132).
# A set of masked columns joined by declared foreign keys must mask to the same
# value or the key does not validate at load, so one generator is chosen for the
# whole set; this is the refusal when none fits all of them. {reason} carries
# every column of the group, the cause, and the escapes that apply to that cause
# -- event.ArgKey has no key for a set of columns, the same borrowing
# plan.refused.unique_domain above makes. {table} and {column} anchor the line on
# one member, as every plan refusal does.
#
# It is a code of its own and not plan.refused.unique_domain, which it borrowed
# when T-0132 landed: two of its three causes fire with no member under a unique
# index at all, so that template stated a fact about the schema that was not
# true (T-0132 review).

- code: plan.refused.equality_group
  kind: error
  stage: plan
  exit: 12
  message: "{table}.{column} is in a group of columns joined by foreign keys that must mask alike, and no masker fits all of them: {reason}"
  args: [table, column, count, reason]

# internal/classify's fkPairs (T-0253) refuses to raise a column beside a
# certain personal column when its validated foreign-key partner cannot be
# raised the same way -- it already carries a decision ARCHITECTURE.md §4
# forbids overriding, or measured two-letter-code evidence the column is a
# code lookup -- rather than raise one end and leave the other's identical
# values copied. This is the refusal that turns that signal
# (Decision.Refused, Decision.RefusedPartner) into an exit before either end
# loads unmasked (tracker T-0257, internal/plan/fkpair.go). {reason} carries
# the partner column, why it could not be raised, and both --unmask escapes,
# because event.ArgKey has no key for a foreign-key partner -- the same
# borrowing plan.refused.equality_group above makes.

- code: plan.refused.fk_pair
  kind: error
  stage: plan
  exit: 12
  message: "{table}.{column} is one end of a validated foreign key that cannot be masked without leaving the other end's identical values unmasked: {reason}"
  args: [table, column, reason]

# {reason} carries the parent table of the edge. event.ArgKey has no key for the
# other end of a foreign key (internal/event/event.go), and this message has to
# name both ends and the columns to be actionable, so it borrows {reason}. Owed
# to the task that adds an ArgKey for it (e.g. ArgParent): add the key and
# re-template this message; do not leave a refusal that names one end of an edge.

# The recreated-DDL literal rule (ARCHITECTURE.md §11.1, amended 2026-09-14,
# T-0134; internal/plan/ddlliteral.go). A string literal inside a column
# default, a CHECK constraint or a generated expression is recreated in the
# target verbatim, so it is inside the data boundary exactly as a row value is:
# the 2026-09-09 review put DEFAULT 'ddl.canary@example.org' on a masked email
# column, saw every row masked and the default survive into pg_attrdef, and the
# run exited 0 (finding 5).
#
# Two codes, because the two cases have different remedies. On an *unmasked*
# column the operator can say in writing that the literal is not a person's, and
# {reason} carries the --unmask spelling that does it. On a *masked* column
# there is nothing to say: the object is a predicate or a derivation lazyslice
# may not rewrite, or a default it has no way to substitute into, so the target
# cannot be built from this source and it is a target-schema refusal beside
# target.schema.not_recreatable.
#
# {column} carries a column name for a default or a generated expression and a
# constraint name for a CHECK, as target.schema.not_recreatable.function's does,
# and for the same reason: event.ArgKey has no key for a constraint. {reason} is
# a category name -- email, phone, financial_account -- and never the literal.

- code: plan.refused.ddl_literal
  kind: error
  stage: plan
  exit: 12
  message: "{table}.{column} is not masked and its recreated DDL carries a literal that parses as personal data: {reason}"
  args: [table, column, reason]

- code: target.schema.literal_not_rewritable
  kind: error
  stage: plan
  exit: 13
  message: "{table}.{column} is masked and its recreated DDL carries a literal lazyslice cannot rewrite: {reason}"
  args: [table, column, reason]

# The 2026-09-15 red team's A4b, A11 and A12: a value hidden in the schema
# rather than in a row. {table} carries the type's qualified name, because a
# type is the object this refusal is about and event.ArgKey has no key for one.
- code: target.schema.type_literal
  kind: error
  stage: plan
  exit: 13
  message: "type {table} carries a literal in {column} that parses as personal data and cannot be rewritten: {reason}"
  args: [table, column, reason]

- code: target.schema.not_recreatable
  kind: error
  stage: plan
  exit: 13
  message: "the foreign key on {table} ({column}) into {reason} cannot be recreated in the target"
  args: [table, column, reason]

# The extract stage (ARCHITECTURE.md §2 "extract, transform, load", §12).
# Extractor.Extract takes no event.Sink -- core.Run is the only producer -- so
# the code below is declared in internal/extract/codes.go beside the *Refusal
# that carries it, and emitted by core from that error. The exit code is
# ADR-005's "7 extract or load".
#
# {reason} carries the server's five-character SQLSTATE, which is an identifier
# and not a value: a PgError's Detail, Where and Hint quote the row and are
# dropped before the refusal is built (THREAT_MODEL.md T4).

- code: extract.refused.standby_cancelled
  kind: error
  stage: extract
  exit: 7
  message: "the source cancelled the read of {table}: the snapshot conflicts with recovery on a standby (SQLSTATE {reason}); retry, or run against the primary"
  args: [table, reason]

# The transform stage (ARCHITECTURE.md §4 and §5). Transformer.Transform takes
# no event.Sink either, so this is declared in internal/transform/codes.go.
#
# ADR-005's exit table names "7 extract or load" and does not name transform
# separately; a masker refusal stops the same movement of rows between the two,
# so it takes the same exit. internal/transform/CLAUDE.md records the reading.
#
# The message names the column and the masker id and never the value: a value
# the masker refused is still a production value, and an error string is a way
# out of the process (THREAT_MODEL.md T4).

- code: transform.refused.masker
  kind: error
  stage: transform
  exit: 7
  message: "masker {reason} refused a value in {table}.{column}: it is not copied through"
  args: [table, column, reason]

# The load stage (ARCHITECTURE.md §11). Loader.Load takes no event.Sink in §2,
# and core.Run is the only producer of events (§7), so the refusals below are
# declared in internal/load/codes.go beside the *load.Refusal that carries them
# and emitted by core from that error. The exit codes are ADR-005's table: 7
# "extract or load", 8 "FK verification".
#
# Two codes are the exception and are sent from inside internal/load, through the
# sink core hands to load.New: §11.1 requires each drop to be printed *before* it
# happens, and a list returned at the end of the stage is a list printed after
# the tables are gone.
#
# {column} carries an index, constraint or sequence name as well as a column
# name: event.ArgKey has no key for any of the three (internal/event/event.go),
# and a refusal that could not name the object it failed on would not be
# actionable. Owed to the task that adds those keys: add them and re-template
# these messages. {reason} carries the server's five-character SQLSTATE, which is an
# identifier and not a value: a PgError's Detail, Where and Hint quote the row
# and are dropped before the refusal is built (THREAT_MODEL.md T4).

- code: load.target.dropping
  kind: info
  stage: load
  message: "dropping {table} in the target"
  args: [table]

# T-0133, 2026-09-14 (docs/reviews/2026-09-09 finding 4): core.Run sends this
# through load.DropLoaded when a residual-class verify failure (exit 9) means
# the target this run just loaded holds personal data. It is a code of its own,
# not a reuse of load.target.dropping above, because the two happen at
# different moments a transcript reader must be able to tell apart: before the
# rows go in, and after a verify failure says they should not have.
# ARCHITECTURE.md §9 rule 1 and THREAT_MODEL.md T2: a target on the source's own
# cluster is eligible by design (a different database on one server is the
# ordinary local case) and has to say so, because the write is landing on the
# same server the production data is on.
- code: target.warn.same_cluster
  kind: warn
  stage: discover
  message: "target {database} is on the same cluster as the source: this run writes to the source's own server"
  args: [database]

- code: load.target.quarantine_dropping
  kind: info
  stage: load
  message: "dropping {table} in the target: the last run left personal data in it"
  args: [table]

# The 2026-09-15 red team's A07: the quarantine dropped tables and nothing else,
# so a domain or an enum type this run created outlived the refusal that found
# the personal data in it. {table} carries the object's name.
- code: load.target.quarantine_dropping_object
  kind: info
  stage: load
  message: "dropping object {table} in the target: it was created by a run that left personal data behind"
  args: [table]

- code: load.table.loaded
  kind: progress
  stage: load
  message: "{table}: {count} rows"
  args: [table, count]

- code: load.refused.ddl
  kind: error
  stage: load
  exit: 7
  message: "the target refused the statement that recreates {table} ({column}): SQLSTATE {reason}"
  args: [table, column, reason]

- code: load.refused.copy
  kind: error
  stage: load
  exit: 7
  message: "the rows of {table} did not go in: SQLSTATE {reason}; the table is empty, not half loaded"
  args: [table, reason]

- code: load.refused.fk_invalid
  kind: error
  stage: load
  exit: 8
  message: "the foreign key {column} on {table} does not validate: the slice is missing rows it references"
  args: [table, column]

# The three lock-and-recheck refusals (ARCHITECTURE.md §11.2, amended
# 2026-09-14). Each drop takes its table's ACCESS EXCLUSIVE lock with NOWAIT and
# re-verifies what the gate approved before it destroys anything; a target that
# is no longer the database the gate approved is refused, the transaction rolls
# back and the run's marker row is closed failed.
#
# The exit is 4 and not 7, because none of the three is a load that went wrong:
# each is the target refusal of ARCHITECTURE.md §9 arriving later, because the
# evidence for it arrived later. {count} is a row count, which is a number and
# not a value (THREAT_MODEL.md T4).

- code: load.refused.target_locked
  kind: error
  stage: load
  exit: 4
  message: "{table} in the target could not be locked for dropping: something else is using this database"
  args: [table]

- code: load.refused.target_changed
  kind: error
  stage: load
  exit: 4
  message: "{table} in the target changed after the gate approved it, before anything was dropped: {reason}"
  args: [table, reason]

- code: load.refused.marker_changed
  kind: error
  stage: load
  exit: 4
  message: "the lazyslice_meta row that authorised truncating this target is gone or has changed: nothing was dropped ({table})"
  args: [table]

# T-0252 (docs/reviews/2026-09-15-redteam/round5-still-leaking.json). The run
# lease is a dedicated connection holding pg_try_advisory_xact_lock open,
# idle in transaction, for the whole of a run; nothing re-asked whether it
# still held after the gate's first probe, so a reaper, a pooler restart or a
# dropped connection could end it with the run never noticing, and a second
# lazyslice run could take the target apart underneath the first. The loader
# now asks internal/pg's Lease.Alive before the whole-target recheck and
# before each table's own lock-and-recheck, and refuses rather than falling
# through when it is not.

- code: load.refused.lease_lost
  kind: error
  stage: load
  exit: 4
  message: "the run lease on this target is no longer held: it may have been terminated, or another run may already hold the target"
  args: []

# The two schema-recreation refusals internal/load/ddl raises (§11.1). §11.1
# raises them at plan -- before the snapshot is used for keys and before
# anything in the target is dropped -- so their stage is plan, beside
# target.schema.not_recreatable above, which internal/plan raises for the other
# case §11.1 names. Exit 13 is ADR-005's "target schema not recreatable".
#
# There is deliberately no flag that drops the offending default and carries on:
# the application's first INSERT is the point of the tool. The remedy is the
# load-into-existing-schema mode ADR-005's reversal condition names, deferred
# with an epic in ARCHITECTURE.md §14.

- code: target.schema.not_recreatable.function
  kind: error
  stage: plan
  exit: 13
  message: "{table}.{column} depends on {reason}, a function lazyslice does not recreate in the target"
  args: [table, column, reason]

- code: target.schema.not_recreatable.collation
  kind: error
  stage: plan
  exit: 13
  message: "{table}.{column} uses the collation {reason}, which lazyslice does not recreate in the target"
  args: [table, column, reason]

# The verify stage (ARCHITECTURE.md §6, ADR-005 "Verify"). Verifier.Verify takes
# no event.Sink -- core.Run is the only producer of events (§7) -- so the codes
# below are declared in internal/verify/codes.go: every pipeline.Check in the
# report carries one, and a failing check comes back as a *verify.Refusal core
# renders from here. The exit codes are ADR-005's table: 8 "FK verification", 9
# "residual personal data, or residual hits that could not be confirmed", and 7
# "extract or load" for the two checks that table names no code for -- a row
# count or a sequence that disagrees with the plan is a failure of the movement
# of rows, and internal/verify/CLAUDE.md records the reading.
#
# {reason} carries a fixed phrase from internal/verify/reasons.go, a category
# name or a validator name. It never carries a row value, the candidate a
# confirmation probe was built from, or the value that differed
# (THREAT_MODEL.md T4).
#
# There is deliberately no single "check passed" code with the check's name as
# an argument: pipeline.Check has no free-text field and event.ArgKey has no key
# for a check name, so each check's own line is its own code below.

- code: verify.refused.fk
  kind: error
  stage: verify
  exit: 8
  message: "the foreign key {column} on {table} does not hold: {count} rows reference a parent row the target does not have"
  args: [table, column, count]

- code: verify.refused.residual
  kind: error
  stage: verify
  exit: 9
  message: "a value in {table}.{column} is in the target as the source holds it: {reason}"
  args: [table, column, reason]

- code: verify.refused.residual_unconfirmable
  kind: error
  stage: verify
  exit: 9
  message: "residual hits in {table}.{column} could not be confirmed: {reason}"
  args: [table, column, reason]

- code: verify.refused.second_net
  kind: error
  stage: verify
  exit: 9
  message: "{table}.{column} is not masked and {count} of its values validate as {reason}: mask it with --mask {table}.{column}={reason}, or leave its table out with --skip-table {table}"
  args: [table, column, count, reason]

# T-0369: the second net scans the string leaves of every json/jsonb/hstore
# column regardless of category (internal/verify/secondnet.go's own package
# comment), and it also scans every text/digits-family column no category but
# {reason} itself claimed -- so the plain "--mask {table}.{column}={reason}"
# hint above is sometimes a flag `classify.refused.mask` (exit 2) refuses: no
# category but semi_structured accepts the json family, --mask changes
# nothing on a column the net reads whether or not it was masked, and a
# category can match a family rules.yml never wrote it a masker for (a
# network_id hit on a uuid column, say). Each of the three cases below is its
# own code, named for the hint it prints instead, and internal/verify chooses
# among them and the ordinary code above rather than this file trying to
# express the choice in one template.

- code: verify.refused.second_net_document
  kind: error
  stage: verify
  exit: 9
  message: "{table}.{column} is not masked and {count} of its values validate as {reason}: no category but semi_structured accepts a json, jsonb or hstore column, so mask it with --mask {table}.{column}=semi_structured, or leave its table out with --skip-table {table}"
  args: [table, column, count, reason]

- code: verify.refused.second_net_document_masked
  kind: error
  stage: verify
  exit: 9
  message: "{table}.{column} is already masked and {count} of its values still validate as {reason}: --mask cannot change its category, so leave its table out with --skip-table {table}"
  args: [table, column, count, reason]

- code: verify.refused.second_net_type_conflict
  kind: error
  stage: verify
  exit: 9
  message: "{table}.{column} is not masked and {count} of its values validate as {reason}, a category this column's type does not accept: mask it with --mask {table}.{column}=special_category instead, which internal/classify/rules.yml accepts on every type, or leave its table out with --skip-table {table}"
  args: [table, column, count, reason]

# The catalog pass (internal/verify/catalog.go, T-0134). The other checks read
# the target's rows; this reads its pg_attrdef and pg_constraint, because a
# literal in a recreated default is a value no row scan can see and the
# application's next INSERT writes it into a row. {reason} is a fixed phrase
# naming the object class and the category, never the literal.

- code: verify.refused.catalog_literal
  kind: error
  stage: verify
  exit: 9
  message: "the target's schema carries a literal that parses as personal data in {table}.{column}: {reason}"
  args: [table, column, count, reason]

- code: verify.refused.row_count
  kind: error
  stage: verify
  exit: 7
  message: "{table} holds {count} rows in the target: {reason}"
  args: [table, count, reason]

- code: verify.refused.sequence
  kind: error
  stage: verify
  exit: 7
  message: "the sequence behind {table}.{column} was not reset: {reason}"
  args: [table, column, reason]

- code: verify.residual.unconfirmed
  kind: warn
  stage: verify
  message: "{count} residual hits in {table}.{column} are absent from the source: a filter false positive, or the source changed since the snapshot"
  args: [table, column, count]

# ADR-015: a masked person name that equals a real name elsewhere in its column,
# that the masker's own list contains, that the masker produced every copy of,
# and that no source row still holds in its own row. A count, never a value.
- code: verify.residual.explained
  kind: info
  stage: verify
  message: "{count} masked values in {table}.{column} equal a real value elsewhere in this column: the name list contains it, the masker produced every copy, and no row kept its own"
  args: [table, column, count]

- code: verify.sample.differs
  kind: warn
  stage: verify
  message: "{count} sampled rows of {table} differ from the source in a column the run did not mask: the source changed since the snapshot"
  args: [table, count]

- code: verify.sample.absent
  kind: warn
  stage: verify
  message: "{count} sampled rows of {table} are no longer in the source"
  args: [table, count]

- code: verify.row_count.reported
  kind: info
  stage: verify
  message: "{table} holds {count} rows and the plan gives it no count to check: it is schema-only, or a lookup with no rows in the source"
  args: [table, count]

- code: verify.sequence.unowned
  kind: info
  stage: verify
  message: "the sequence {column} on {table} is owned by no column of it: nothing reset it and nothing checks it"
  args: [table, column]

- code: verify.sample.reported
  kind: info
  stage: verify
  message: "{table} was not sampled: the plan holds no identity keys for it, an identity column is masked, or the source would not open a second transaction"
  args: [table]

- code: verify.fk.passed
  kind: info
  stage: verify
  message: "{count} foreign keys hold over the rows in the target"
  args: [count]

- code: verify.residual.passed
  kind: info
  stage: verify
  message: "{count} masked values were tested against the residual filter and none of them is in the source"
  args: [count]

- code: verify.residual.probes
  kind: info
  stage: verify
  message: "{count} confirmation probes were sent to the source"
  args: [count]

- code: verify.second_net.passed
  kind: info
  stage: verify
  message: "{count} columns the target holds unmasked were scanned and none of them validates as a category"
  args: [count]

- code: verify.catalog.passed
  kind: info
  stage: verify
  message: "{count} defaults, generated expressions and constraints in the target's schema carry no personal literal"
  args: [count]

- code: verify.row_count.passed
  kind: info
  stage: verify
  message: "{count} steps hold exactly the rows the plan says they hold"
  args: [count]

- code: verify.sequences.passed
  kind: info
  stage: verify
  message: "{count} sequences are set to their column's maximum"
  args: [count]

- code: verify.sample.passed
  kind: info
  stage: verify
  message: "{count} sampled rows match the source in every column the run did not mask"
  args: [count]

# ---------------------------------------------------------------------------
# The run itself (internal/core). core.Run is the only producer of events
# (ARCHITECTURE.md §7), so these are the codes for the facts about a run as a
# whole rather than about one stage's findings: which database is which, what
# the role can do, what the plan says, where the masking key came from, and
# what happened to lazyslice.yml. They are declared in internal/core/codes.go.
#
# Every value substituted below is an identifier, a count, a fingerprint or a
# flag spelling. {statement} carries SQL rendered from identifiers — the GRANT
# block of §9 and the `git rm --cached` of §9 "The repository" — and never a
# statement the run executed (THREAT_MODEL.md T4).

# The two stage brackets. They are emitted around every stage core runs, so
# their `stage:` is whichever stage they bracket rather than one of them; the
# line printer renders neither, and --json carries both.
- code: stage.start
  kind: stage_start
  stage: any
  message: "{stage}"
  args: [stage]

- code: stage.done
  kind: stage_done
  stage: any
  message: "{stage}"
  args: [stage]

# Emitted by a stage this build does not implement (internal/discover). It is
# an Info and not an Error because the caller decides whether a missing stage
# is fatal: a run with --source and --target never reaches the ladder.
- code: stage.not_implemented
  kind: info
  stage: any
  message: "{stage} is not in this build"
  args: [stage]

- code: source.refused.none
  kind: error
  stage: discover
  exit: 3
  message: "no source: pass --source postgres://..."
  args: []

# docs/reviews, 2026-09-14, finding 2: the committed file's source_ref failed
# to parse for a reason the sslrootcert retry cannot fix, and the run refuses
# rather than silently falling through to discovery. {reason} is pgconn's own
# parse error, safe to show because the string it names was rebuilt from a
# Ref, which never carries a password.
- code: source.refused.ref_invalid
  kind: error
  stage: discover
  exit: 2
  message: "./lazyslice.yml's source_ref does not describe a usable connection: {reason} — edit the file's source: block, delete it to let lazyslice rediscover the source, or pass {flag} to override it for this run"
  args: [reason, flag]

- code: source.decided
  kind: decision
  stage: discover
  message: "source {database} on {host} as {role} ({provenance}) — {flag}"
  args: [database, host, role, provenance, flag]

- code: target.decided
  kind: decision
  stage: discover
  message: "target {database} on {host} — {flag}"
  args: [database, host, flag]

# The loudest lines in the decision header (§9). The statement block is the
# whole remedy, with this database's own names in it, because the rule that
# section cites is "ends in a command, not a doc link".
- code: source.role.writable
  kind: warn
  stage: discover
  message: "the role {role} can write to {count} table(s) in {database} — recommend a read-only role: {statement}"
  args: [role, database, count, statement]

- code: source.refused.writable_role
  kind: error
  stage: discover
  exit: 6
  message: "the source role {role} can write and --require-read-only-role is set"
  args: [role]

# T-0241, round-4 red team (docs/reviews/2026-09-15-redteam/round4-still-leaking.json,
# "a read replica"): pg_is_in_recovery() is PUBLIC-executable on every
# supported version, so this prints whenever the source is a streaming
# standby, whether or not the cluster identity above could tell — an operator
# watching an interactive run is exactly who should be told the database
# being read is not itself the primary. {reason} carries the primary's
# sender_host/sender_port from pg_stat_wal_receiver where the role could read
# them, and is empty otherwise.
- code: source.warn.standby
  kind: warn
  stage: discover
  message: "source {host} is a streaming standby{reason}"
  args: [host, reason]

# The second, independent rail beside the warning above: a headless run with
# no --target has nobody to show that warning to, and the discovery ladder's
# clusterKey comparison — host and port only — cannot tell a standby's own
# primary apart from an unrelated server, because the two ordinarily publish
# on different ports (round-4's second reproduction, "a target URL taken from
# a compose file that points at prod"). A --target the operator named, on the
# standby's primary or anywhere else, never reaches this check.
- code: source.refused.standby_no_target
  kind: error
  stage: discover
  exit: 4
  message: "source {host} is a streaming standby and no {flag} was given: lazyslice cannot tell its primary apart from an unrelated server"
  args: [host, flag]

- code: source.refused.statement
  kind: error
  stage: extract
  exit: 7
  message: "the source refused a statement this run sent: its shape is not on the allowlist, which is a bug in lazyslice and not in your database"
  args: []

- code: target.marker.bound
  kind: info
  stage: discover
  message: "{database} carries lazyslice's own marker for this source: it will be truncated and reloaded"
  args: [database]

- code: target.marker.secret_changed
  kind: warn
  stage: discover
  message: "secret changed — masked values will differ from the ones already in the target"
  args: []

- code: target.marker.classification_changed
  kind: warn
  stage: discover
  message: "classification changed — masked values will differ from the ones already in the target"
  args: []

# The third of §11.2's three, emitted from the same place as the two above
# (internal/core's markerWarnings) when the marker's tool_version differs from
# this build's. pipeline.Eligibility.PrevToolVersion carries it; internal/pg is
# what fills that field from the marker row, and until it does the comparison
# has nothing to compare and the line stays unprinted.
- code: target.marker.tool_changed
  kind: warn
  stage: discover
  message: "lazyslice version changed — masked values may differ from the ones already in the target"
  args: []

- code: introspect.schema.read
  kind: info
  stage: introspect
  message: "{count} tables on Postgres {version}: {reason}"
  args: [count, version, reason]

# The review pin (internal/core's checkReviewed, Request.Reviewed). --tui runs
# the pipeline twice -- once as far as the plan to fill the two screens, once
# for real -- and the second pass takes its own snapshot and walks the discovery
# ladder again. This is the refusal when the second pass is not the run the
# operator reviewed. {reason} carries what changed: an endpoint as dsn.Ref
# renders it, or the sentence saying the source schema is not the one that was
# read. Neither is a value from either database (THREAT_MODEL.md T4).
#
# The exit is ADR-005's 12. That table calls 12 "plan refused" and lists four
# cases, none of them this one; ADR-005 is owed a fifth case or an exit of its
# own (internal/core/CLAUDE.md).
- code: core.refused.reviewed_changed
  kind: error
  stage: introspect
  exit: 12
  message: "this run is not the one that was reviewed: {reason}"
  args: [reason]

# ADR-008 §6's Q2, the root table question. plan.root.decided is the decision
# line: printed once, whatever decided it -- --root, a committed
# lazyslice.yml, an answer at the prompt, or the computed default taken
# silently -- exactly as source.decided and target.decided always print
# regardless of how their own endpoint was decided. plan.root.candidate is one
# line of "?"'s ranked top five (§3.1), through the line printer rather than
# written to stderr directly. plan.root.unknown is the re-ask: the typed
# answer names no table, or names more than one, and {reason} is the same
# sentence --root would be refused with.
- code: plan.root.decided
  kind: decision
  stage: plan
  message: "root {table} ({reason}) — {flag}"
  args: [table, reason, flag]

- code: plan.root.candidate
  kind: info
  stage: plan
  message: "{count}. {table} — {reason}"
  args: [count, table, reason]

- code: plan.root.unknown
  kind: warn
  stage: plan
  message: "{reason}"
  args: [reason]

# One line per step of the plan (§3.5). {reason} carries the step's mode and
# its Why, both rendered from a fixed template set in internal/plan.
- code: plan.step
  kind: info
  stage: plan
  message: "{table}: {count} rows, {reason}"
  args: [table, count, reason]

# T-0321: dogfood session 1's own report — "the plan listed 114 of 143 tables
# as schema_only; unreachable one per line; nothing summarised either".
# Printed once, right after the last plan.step line: how many tables the walk
# reached (every mode but schema_only) against how many it left unreachable,
# and the total rows the plan holds (plan.estimate's own {count}, repeated
# here because this line is the one a reader scrolling past the per-table
# list actually stops on).
- code: plan.summary
  kind: info
  stage: plan
  message: "{table_count} table(s) reached, {unreachable_count} unreachable, {row_count} rows"
  args: [table_count, unreachable_count, row_count]

- code: plan.estimate
  kind: info
  stage: plan
  message: "{count} rows, {reason}; the snapshot is held about {seconds}s, assuming 20,000 rows/s"
  args: [count, reason, seconds]

# §3.2's two findings, one code each. A detected pair is not followed in v1, and
# saying so is what keeps research/COMPLAINTS.md FK-10's silently empty slice
# impossible. {reason} carries the pair as "schema.table (type_col, id_col)"
# for plan.polymorphic.detected. plan.polymorphic.unmapped's {reason} is the
# whole finding, already assembled by internal/plan (unmappedFinding,
# polymorphic.go): a column identifier and a count of the distinct values that
# map to no table, never a value and never a digest of one (THREAT_MODEL.md T4
# and T13; T-0131, decided 2026-09-14 — a keyed digest is still an oracle for
# anyone holding the run key it was keyed under).
- code: plan.polymorphic.detected
  kind: warn
  stage: plan
  message: "polymorphic pair detected, not followed: no constraint — {reason}"
  args: [reason]

- code: plan.polymorphic.unmapped
  kind: warn
  stage: plan
  message: "{reason}"
  args: [reason]

# §3.2 amendment (2026-09-08, T-POLY): one line per followed virtual edge,
# printed beside the two findings above so the plan states every edge it will
# actually walk. {column} is the bare discriminator column name, {table}
# carries the child table and its id column, and {reason} carries the parent
# table the value resolved to.
- code: plan.polymorphic.inferred
  kind: info
  stage: plan
  message: "{column}: inferred {table} -> {reason}, followed as a virtual parent edge"
  args: [column, table, reason]

# ARCHITECTURE.md §11.1 arm 1's finding for a run with no masking key yet
# (T-0161): a plan-only run with neither $LAZYSLICE_SECRET nor a committed
# secret file plans rather than refusing, and this is what it prints instead
# of masking a masked column's DEFAULT. {reason} is plan.Plan.PendingKeyDefaults
# joined with ", " — schema.table.column identifiers, never a value
# (THREAT_MODEL.md T4). Never fired for a run that writes: internal/core
# resolves a key in full before the plan stage for any such run.
- code: plan.masked_default.pending_key
  kind: info
  stage: plan
  message: "no masking key yet, so these masked defaults still carry the source's literal and will be masked once one exists: {reason}"
  args: [reason]

# T-0186's own two codes: --allow-type-literal's opt-out, honoured or expired,
# stated in the open the same way a column's own opt-out shows in its
# classify.masked/copied.column reason and its own
# classify.column.opt_out_expired warn. Raised here in plan and not in
# internal/classify: a type opt-out is resolved and merged in internal/core
# (planRequest), not decided by the classifier, so it has no classify-stage
# decision to expire. {table} carries the plain "schema.type" name
# (names.go's resolveType/typeFingerprint), not a table identifier — reusing
# the arg rather than adding one for a name shape that already fits it.
- code: plan.type_literal.allowed
  kind: info
  stage: plan
  message: "{table}: the recreated type literal is allowed — {reason}"
  args: [table, reason]

- code: plan.type_literal.opt_out_expired
  kind: warn
  stage: plan
  message: "the opt-out on type {table} is not honoured: it records no type fingerprint, or the type changed or is gone"
  args: [table]

# ARCHITECTURE.md §9 "The repository", one code per branch, because every branch
# prints what it did. The stage is transform: the masking key is transform's
# input, and the key is what these are about.
- code: secret.gitignore.added
  kind: info
  stage: transform
  message: "added {path} to .gitignore"
  args: [path]

- code: secret.file.written
  kind: info
  stage: transform
  message: "wrote a new masking key to {path}"
  args: [path]

- code: secret.file.unprotected
  kind: warn
  stage: transform
  message: "not a git repository — {path} is not protected by .gitignore"
  args: [path]

- code: secret.key.ephemeral
  kind: warn
  stage: transform
  message: "cannot write .gitignore — masking key is ephemeral; set LAZYSLICE_SECRET or --secret-file outside the repository"
  args: [path]

# T-0251 round 6: secret.key.ephemeral's message above is only true when
# .gitignore itself could not be written to at all. .gitignore can be written
# to successfully and still not protect {path} — a later rule un-ignoring it
# (secret.gitignore.negated, which names that rule), or git being absent from
# PATH so the entry just added could never be checked
# (secret.gitignore.unverifiable) — and telling the operator ".gitignore
# cannot be written" in either case sends them to look at a file that already
# holds the right line.
- code: secret.gitignore.negated
  kind: warn
  stage: transform
  message: "{path} is added to .gitignore, but a later rule un-ignores it ({reason}) — masking key is ephemeral; remove or narrow that rule, or set LAZYSLICE_SECRET or --secret-file outside the repository"
  args: [path, reason]

- code: secret.gitignore.unverifiable
  kind: warn
  stage: transform
  message: "{path} is added to .gitignore, but git is not on PATH to verify it is actually ignored — masking key is ephemeral; install git, or set LAZYSLICE_SECRET or --secret-file outside the repository"
  args: [path]

- code: secret.gitignore.not_ignored
  kind: warn
  stage: transform
  message: "{path} is added to .gitignore, but git does not consider it ignored — masking key is ephemeral; check .gitignore by hand, or set LAZYSLICE_SECRET or --secret-file outside the repository"
  args: [path]

- code: secret.git.absent
  kind: warn
  stage: transform
  message: "git not found — could not verify {path} is untracked"
  args: [path]

- code: secret.file.tracked
  kind: error
  stage: transform
  exit: 2
  message: "{path} is tracked by git: {statement}"
  args: [path, statement]

- code: secret.refused.no_key
  kind: error
  stage: transform
  exit: 5
  message: "no masking key: {path} could not be read or written"
  args: [path]

# The 2026-09-15 red team, against ARCHITECTURE.md §9 "The repository" and
# THREAT_MODEL.md T6.
- code: secret.refused.symlink
  kind: error
  stage: transform
  exit: 5
  message: "{path} is a symbolic link: the masking key would be written outside the repository, where .gitignore does not reach it"
  args: [path]

- code: secret.refused.permissive
  kind: error
  stage: transform
  exit: 5
  message: "{path} is readable by other accounts on this machine: {statement}"
  args: [path, statement]

# The 2026-09-16 round 2 red team, against ARCHITECTURE.md §9 "The repository"
# and THREAT_MODEL.md T6: a symlinked parent directory reuses
# secret.refused.symlink above (checkSecretParentSymlink, internal/core) — the
# code is the same one, printed before the direct-symlink check ever runs. A
# hard link, which no path check can see, is its own code.
- code: secret.refused.hardlink
  kind: error
  stage: transform
  exit: 5
  message: "{path} has more than one name on disk: it may already be readable under a path .gitignore never protected"
  args: [path]

# The 2026-09-16 round 2 red team's R2-16, against ARCHITECTURE.md §10 and
# THREAT_MODEL.md T5: --password-command was written into lazyslice.yml
# verbatim, and the header promises the file never contains a secret. The
# emitted command's argv is screened by a heuristic (internal/emit) and, when
# it looks like it embeds a value rather than fetching one — `echo` or
# `printf` given the password as a literal argument is the plain case — the
# command is left out of the file rather than written, and this line says so.
- code: secret.password_command.withheld
  kind: warn
  stage: emit
  message: "password_command was not written to {path}: its argv looks like it embeds a value rather than fetching one; pass --password-command again on every run"
  args: [path]

# T-0213 (THREAT_MODEL.md T5, 2026-09-16 amendment): --password-command was
# set and no earlier source in ARCHITECTURE.md §9's Q4 precedence (a password
# in the connection string, $PGPASSWORD, ~/.pgpass) resolved one for this
# endpoint, so internal/discover ran the command and it did not supply a
# password — a non-zero exit, a 30 second timeout, or empty stdout. {reason}
# names which of those it was and nothing else the command printed reaches
# this line, any other event, lazyslice.yml or the trace.
- code: secret.password_command.failed
  kind: error
  stage: discover
  exit: 5
  message: "no password for {host}: --password-command {reason}"
  args: [host, reason]

- code: config.file.read
  kind: info
  stage: emit
  message: "from {path}"
  args: [path]

- code: config.file.written
  kind: info
  stage: emit
  message: "wrote {path} (commit it for CI)"
  args: [path]

# T-0320: dogfood session 1's own report — "a successful run prints the load
# counts and then 'wrote ./lazyslice.yml (commit it for CI)'; nothing says
# that foreign keys validated, N row counts matched, the residual scan found
# nothing, or the second net scanned M columns". One line, printed once, at
# the very end of a green run — right after config.file.written.
- code: verify.summary
  kind: info
  stage: emit
  message: "verify: {fk_count} foreign key(s) validated, {table_count} table row count(s) matched ({row_count} rows total), the residual scan found nothing ({residual_count} value(s) tested), the second net scanned {column_count} column(s)"
  args: [fk_count, table_count, row_count, residual_count, column_count]

# The other half of dogfood session 1: "nothing says how to connect to the
# target lazyslice --create-target provisioned (the password lives in the
# container's environment; psql fails until docker inspect)". Printed once,
# right after verify.summary, on every green run — never the password itself
# (THREAT_MODEL.md T5).
- code: target.connect.container
  kind: info
  stage: emit
  message: "target {database} on {host}:{port} as {role} — password: docker exec {container} printenv POSTGRES_PASSWORD"
  args: [database, host, port, role, container]

- code: target.connect.password_command
  kind: info
  stage: emit
  message: "target {database} on {host}:{port} as {role} — password: from --password-command"
  args: [database, host, port, role]

- code: target.connect
  kind: info
  stage: emit
  message: "target {database} on {host}:{port} as {role} — password: wherever you supplied it for --target ($PGPASSWORD, ~/.pgpass, or the connection string itself)"
  args: [database, host, port, role]

- code: config.refused.where_withheld
  kind: error
  stage: plan
  exit: 2
  message: "{path} records a withheld --where predicate and this run passed none: pass {flag} again, or the slice would silently be a different one"
  args: [path, flag]

# ADR-012 (2026-09-14): mapping_file is a v1 escape hatch nothing implements —
# the config decoder read it, emit round-tripped it and the unique-domain
# refusal recommended it, but no stage ever reads the CSV or applies a
# replacement (docs/reviews/2026-09-09/REVIEW.md finding 10). {path} naming it
# for {table}.{column} is refused by name rather than silently ignored.
# T-0142 is the task that implements the full contract.
- code: config.refused.mapping_file
  kind: error
  stage: emit
  exit: 2
  message: "{path} names mapping_file for {table}.{column}, which is not supported in this version: remove the mapping_file: line for {table}.{column} from {path}, then use --unmask {table}.{column}=REASON, or a lower --take or --cap"
  args: [path, table, column]

# The two codes that exist so that "something went wrong" is never printed as a
# code a CI job branches on. run.refused.usage is a flag the operator has to fix
# that could only be checked once the catalog was read — an --unmask or a
# --skip-table naming nothing.
- code: run.refused.usage
  kind: error
  stage: plan
  exit: 2
  message: "a flag names something this source does not have"
  args: []

- code: run.refused.internal
  kind: error
  stage: plan
  exit: 1
  message: "lazyslice failed for a reason it has no code for; run with --debug"
  args: []

# SIGINT or SIGTERM. It is a code rather than a bare exit because internal/core
# is the only producer of events: without a row here the transcript said exit 1
# (run.refused.internal) while the process returned 130, and a CI job that reads
# the stream and a CI job that reads $? disagreed about the same run.
- code: run.interrupted
  kind: error
  stage: extract
  exit: 130
  message: "interrupted: the target transaction was rolled back, and tables already committed were left as they are"
  args: []

# ARCHITECTURE.md §7: core.Run sends into a bounded channel of 256 and drops
# Progress events when it is full, "with the drop counted". This is the count,
# printed once at the end of a run in which anything was dropped, so that a
# transcript missing progress lines says why.
- code: run.progress.dropped
  kind: warn
  stage: emit
  message: "{count} progress event(s) were dropped: the renderer could not keep up with the pipeline"
  args: [count]

# T-0133, 2026-09-14 (docs/reviews/2026-09-09 finding 4): a residual-class
# verify failure (exit 9) means the target holds personal data, so core tries to
# drop every table the run just loaded (load.DropLoaded) before closing the
# marker row to failed. This is printed when that drop itself fails on {table}:
# the run still exits on the verify failure's own code, but the target was not
# actually emptied and the data the verify failure named is still there.
- code: run.quarantine.failed
  kind: warn
  stage: verify
  message: "the target could not be emptied after the failure above: dropping {table} did not succeed, and it may still hold personal data"
  args: [table]

# ---------- discovery (ARCHITECTURE.md §9, ADR-008) ----------
#
# The candidate list and the ladder's own decisions. Every value substituted
# below is an identifier, a count or a provenance; a candidate's endpoint is
# dsn.Ref.String(), which cannot carry a password because Ref does not hold one
# (THREAT_MODEL.md T4, A3).

- code: discover.candidate.found
  kind: info
  stage: discover
  message: "{provenance}: {host} — postgres {version}, {count} table(s), {reason}"
  args: [provenance, host, version, count, reason]

# An unreachable candidate is printed, not swallowed: it is never selected as
# source or target, and a developer whose database is missing from the run has
# to be able to see why it was skipped.
- code: discover.candidate.unreachable
  kind: info
  stage: discover
  message: "{provenance}: {host} did not answer — {reason}"
  args: [provenance, host, reason]

- code: discover.docker.endpoint
  kind: info
  stage: discover
  message: "docker: {host} ({provenance})"
  args: [host, provenance]

# ADR-008 §3 "Degradation": the message names the endpoint that was actually
# resolved and the step it came from, never a hard-coded socket path. A Docker
# failure never aborts the run; rungs 0 to 2 still answer.
- code: discover.docker.unreachable
  kind: warn
  stage: discover
  message: "docker: {host} {reason} — skipping container discovery; {flag}"
  args: [host, reason, flag]

# THREAT_MODEL.md T2: a container on a remote daemon publishes on the remote
# host's interfaces, so it is never a local candidate and its binding is never
# normalised to loopback (ADR-008 §3, §4).
- code: discover.docker.not_local
  kind: warn
  stage: discover
  message: "docker endpoint {host} ({provenance}) is not local — container discovery skipped; pass --source/--target, or set {flag} to a local socket"
  args: [host, provenance, flag]

# One case of the rule above with a reason of its own: tunnelling ssh:// needs a
# third subprocess and ARCHITECTURE.md §8 fixes the set at two.
- code: discover.docker.ssh
  kind: warn
  stage: discover
  message: "docker endpoint {host} is ssh:// — container discovery skipped; pass --source/--target, or set --docker-host to a local socket"
  args: [host]

- code: discover.docker.context_unreadable
  kind: warn
  stage: discover
  message: "{reason}"
  args: [reason]

# ADR-008 §4: the working_dir filter's stated fallback. It prints the provenance
# it actually used, because the empty case is common rather than exotic.
- code: discover.compose.no_project
  kind: info
  stage: discover
  message: "docker: no compose project for this directory — showing all Postgres containers"
  args: []

# lazyslice never starts the developer's own compose services (ADR-008 §7): the
# command is in this template and the service names are the substituted
# identifiers, so no event carries a command line.
- code: discover.compose.stopped
  kind: info
  stage: discover
  message: "compose declares a Postgres service that is not running — start it with: docker compose up -d {provenance}"
  args: [provenance]

# ADR-008 §2: a .env value is used only when it parses whole as a Postgres URI.
# The reason is a category and never any part of the value, because a .env line
# can hold a production password (THREAT_MODEL.md A3).
- code: discover.env.unusable
  kind: warn
  stage: discover
  message: "{provenance} is not a whole postgres:// URI and was not used: {reason}"
  args: [provenance, reason]

- code: discover.source.chosen
  kind: decision
  stage: discover
  message: "source {database} on {host} — {provenance}, {flag} names another"
  args: [database, host, provenance, flag]

- code: discover.target.chosen
  kind: decision
  stage: discover
  message: "target {database} on {host} — {provenance}, {flag} names another"
  args: [database, host, provenance, flag]

# Q1's state: a source was found and nothing target-shaped was. Exit 4, naming
# the flag that settles it (ADR-008 §6).
- code: target.refused.none
  kind: error
  stage: discover
  exit: 4
  message: "no local postgres found to load into: pass {flag}"
  args: [flag]

# ADR-008 §3: --create-target against a docker endpoint that is not local, or
# that does not answer, is a refusal before any container work — never a silent
# no-op and never a container created on someone else's daemon
# (THREAT_MODEL.md T2).
- code: target.refused.docker_not_local
  kind: error
  stage: discover
  exit: 4
  message: "--create-target needs a local docker endpoint: {host} is {reason} — set {flag} to a local socket, or name a database with --target"
  args: [host, reason, flag]

# docs/reviews, 2026-09-14, finding 2: the target side of the same refusal as
# source.refused.ref_invalid above.
- code: target.refused.ref_invalid
  kind: error
  stage: discover
  exit: 2
  message: "./lazyslice.yml's target_ref does not describe a usable connection: {reason} — edit the file's target: block, delete it to let lazyslice rediscover the target, or pass {flag} to override it for this run"
  args: [reason, flag]

# T-0184, ADR-013 (proposed): --yes with no --target, and every reachable
# target-shaped candidate is on the source's own cluster — the 2026-09-15 red
# team's run. Fires ahead of chooseTarget's tie-break; an interactive run
# still reaches it and the same-cluster warning (target.warn.same_cluster)
# unchanged, and a --target named explicitly on the source's cluster never
# reaches this check.
- code: target.refused.headless_same_cluster
  kind: error
  stage: discover
  exit: 4
  message: "every reachable candidate is on {host}, the source's own cluster: pass {flag} to write there on purpose"
  args: [host, flag]

# T-0184, ADR-013 review finding 1: the gate's own Eligibility.SameCluster —
# the authoritative system_identifier/cluster-identity signal, arriving after
# discover.Resolve already chose a target — says a headless, ladder-chosen
# target is on the source's own cluster after all, even though discover's
# cheap clusterKey check (host:port only) did not catch it: a pooler, an SSH
# tunnel, or host.docker.internal vs 127.0.0.1 compare unequal there while
# being one cluster. Distinct from target.refused.headless_same_cluster above:
# that one is discover's own pre-selection refusal over every reachable
# candidate, and this one is the gate's refusal of the one target already
# chosen.
- code: target.refused.gate_same_cluster
  kind: error
  stage: discover
  exit: 4
  message: "the target on {host} is on the source's own cluster: pass {flag} to write there on purpose"
  args: [host, flag]

# ADR-016 (T-0327, dogfood session 2): ./lazyslice.yml records a container
# lazyslice created as the target, this machine's Docker has no container of
# that name, and nothing permits a new one — no --create-target, and nobody at
# a terminal to answer Q1. Before this the run dialled the recorded port with
# no password and stopped at a bare SQLSTATE 28P01.
- code: target.refused.container_missing
  kind: error
  stage: discover
  exit: 4
  message: "./lazyslice.yml's target is the container {container}, which this machine's docker does not have: pass --create-target to start a new one for this directory, or --target to name another database"
  args: [container]
