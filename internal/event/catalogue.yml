# Code catalogue (ARCHITECTURE.md §7).
#
# Every event.Code emitted anywhere in the tree must have a row here; CI fails
# on a code in the tree the catalogue does not carry (internal/event/event.go).
# docs/ERRORS.md is generated from this file by tools/docgen.
#
# Row shape:
#   code:    the event.Code string, dotted "<subject>.<verdict>.<detail>".
#   kind:    one of the event.Kind names (ARCHITECTURE.md §7) — stage_start,
#            stage_done, progress, decision, question, info, warn, error.
#   stage:   the event.Stage name the code is emitted from.
#   exit:    the process exit code (ADR-005), present only for kind: error.
#   message: the rendered template. Placeholders are {argkey}, drawn only
#            from event.ArgKey — a test asserts no template references a key
#            outside that enum. Never a value from a row.
#   args:    the ArgKey names the template uses, for that test to check
#            against.
#
# Scaffold status: only the three codes ADR-008 adds are listed below. The
# rest arrive with the tasks that emit them (internal/event/event.go).

- code: target.refused.unreachable
  kind: error
  stage: discover
  exit: 4
  message: "target {host} did not respond: {reason}"
  args: [host, reason]

- code: target.refused.no_create
  kind: error
  stage: discover
  exit: 4
  message: "role {role} may not create objects in {database}: {statement}"
  args: [role, database, statement]

- code: target.refused.start_timeout
  kind: error
  stage: discover
  exit: 4
  # ADR-008 §6 step 3 requires this message to name the container and
  # "docker logs <name>". Neither is expressible with today's ArgKey enum
  # (internal/event/event.go): ArgStatement is documented there and in
  # ARCHITECTURE.md §7 as SQL rendered from a catalogue template with
  # identifiers substituted, never a docker CLI invocation, and there is no
  # ArgKey for a container name. Owed to the phase 4 task that implements
  # Q1' (ADR-008 §6): add an ArgKey (e.g. ArgContainer) and re-template this
  # message before Q1' ships; do not reuse {statement} for a non-SQL command.
  message: "target container did not become ready after {seconds}s"
  args: [seconds]

# The five gate refusals internal/pg declares (internal/pg/target.go) and could
# not record here, because internal/event/catalogue.yml was not a file that
# task's paths allowed it to write (internal/pg/CLAUDE.md, "Decisions made
# during implementation"). The exit codes are the ones ARCHITECTURE.md §9
# assigns each rule: identity is exit 2, every other refusal is exit 4.

- code: target.refused.same_database
  kind: error
  stage: discover
  exit: 2
  message: "target {database} on {host} is the source database"
  args: [database, host]

- code: target.refused.remote
  kind: error
  stage: discover
  exit: 4
  message: "target {host} is not on this machine: pass {flag} to write to it"
  args: [host, flag]

- code: target.refused.table_cap
  kind: error
  stage: discover
  exit: 4
  message: "target {database} holds {count} user tables, more than lazyslice will check"
  args: [database, count]

- code: target.refused.not_empty
  kind: error
  stage: discover
  exit: 4
  message: "{table} in the target is not empty: {reason}"
  args: [table, reason]

- code: target.refused.probe_failed
  kind: error
  stage: discover
  exit: 4
  message: "could not check the target {database}: {reason}"
  args: [database, reason]

# The classify stage (ARCHITECTURE.md §4). Classifier.Classify takes no
# event.Sink -- it is pure, and core.Run is the only producer -- so the codes
# below are declared in internal/classify/codes.go beside the results that
# produce them and emitted by core from a *pipeline.Classification.
#
# {reason} carries Decision.Reason, which is rendered from the fixed template
# set in internal/classify/reasons.go and parsed back by
# classify.ParseReason: it holds identifiers, category names, type families,
# a closed set of validator phrases and counts, and never a sampled value
# (THREAT_MODEL.md T4, ARCHITECTURE.md §2 "Value-free types").

# The mask-or-copy verdict is carried by the code and not by an argument:
# event.Args has no category or confidence key (internal/event/event.go), so a
# single "decided" code would leave a reader of the --json stream unable to tell
# a masked column from a copied one. internal/invariants/i2_masking_test.go is
# that reader, and its prefix lists ("classify.masked", "classify.copied") are
# where these two spellings come from.

- code: classify.masked.column
  kind: decision
  stage: classify
  message: "{table}.{column}: {reason}"
  args: [table, column, reason]

- code: classify.copied.column
  kind: decision
  stage: classify
  message: "{table}.{column}: {reason}"
  args: [table, column, reason]

- code: classify.column.drift
  kind: warn
  stage: classify
  message: "{table}.{column} is not in {path}: classified fresh and masked at or above possible"
  args: [table, column, path]

# An opt-out is not honoured when the column's type fingerprint has changed
# since it was recorded, and also when it records no fingerprint at all: an
# opt-out nothing can revoke is the fail-open version of THREAT_MODEL.md T3's
# control, so internal/classify treats it as expired rather than as permanent.
# pipeline.Classification.Expired still describes itself as the narrower set;
# that comment is owed the same widening.

- code: classify.column.opt_out_expired
  kind: warn
  stage: classify
  message: "the opt-out on {table}.{column} is not honoured: it records no type fingerprint, or the column's type changed"
  args: [table, column]

- code: classify.refused.strict_schema
  kind: error
  stage: classify
  exit: 10
  message: "{count} columns are not in {path} and {flag} is set"
  args: [count, path, flag]

# The plan stage (ARCHITECTURE.md §3). Planner.Plan takes no event.Sink -- it is
# pure, and core.Run is the only producer -- so the codes below are declared in
# internal/plan/codes.go beside the *plan.Refusal that carries them, and emitted
# by core from that error. Exit codes are ADR-005's table: 2 usage, 11 budget,
# 12 plan refused, 13 target schema not recreatable.
#
# {flag} carries a flag spelling with identifiers substituted, such as
# "--key public.click_stream=col,col or --skip-table public.click_stream". It is
# built from the table's own name and never from a row (THREAT_MODEL.md T4).

- code: plan.refused.no_root
  kind: error
  stage: plan
  exit: 2
  message: "{flag} names no table in the source"
  args: [flag]

- code: plan.refused.key_column
  kind: error
  stage: plan
  exit: 2
  message: "{flag} on {table} names {column}, which is not a column of it or is a system column: there is no ctid rung"
  args: [table, column, flag]

# {reason} carries the offending character or pair -- ";", "--", "/*", a
# backslash, a dollar sign, an unbalanced parenthesis -- and {count} its 1-based
# position in the predicate. Neither is a value and neither echoes the predicate
# text: THREAT_MODEL.md T5 withholds `where` literals, and punctuation is not a
# row (internal/plan/where.go).

- code: plan.refused.where_syntax
  kind: error
  stage: plan
  exit: 2
  message: "{flag} carries {reason} at character {count}: the source only accepts a predicate that stays one"
  args: [flag, reason, count]

- code: plan.refused.key_not_unique
  kind: error
  stage: plan
  exit: 12
  message: "{flag} does not identify a row in {table}: at least one key appears more than once"
  args: [table, flag]

- code: plan.refused.no_identity
  kind: error
  stage: plan
  exit: 12
  message: "{table} has no row identity: pass {flag}"
  args: [table, flag]

- code: plan.refused.unreadable
  kind: error
  stage: plan
  exit: 12
  message: "{role} cannot read {table}, which the slice needs as a parent: {statement}"
  args: [table, role, statement]

- code: plan.refused.skip_parent
  kind: error
  stage: plan
  exit: 12
  message: "{flag} cannot drop {table}: the slice needs it as a parent and would not be referentially complete without it"
  args: [table, flag]

- code: plan.refused.row_budget
  kind: error
  stage: plan
  exit: 11
  message: "{table} takes the slice past {count} rows: raise {flag}, or lower --take, --cap or --depth"
  args: [table, count, flag]

- code: plan.refused.memory_budget
  kind: error
  stage: plan
  exit: 11
  message: "{table} takes the estimated key and filter memory past {count} bytes: raise {flag}, or lower --take, --cap or --depth"
  args: [table, count, flag]

# {reason} carries the category the column is masked under and the type family
# its column has, in that order, because event.ArgKey has no key for either
# (internal/event/event.go) and the message is only actionable if it names both:
# the operator's fix is either an --unmask on the column or a rule change, and
# neither is choosable from a table and a column name alone. Both halves are
# identifiers -- a category from the rule pack and a type family from a fixed
# list -- and neither is a row (THREAT_MODEL.md T4). Owed to the task that can
# write internal/event/event.go: an ArgCategory and an ArgType, and this message
# re-templated onto them. T-0054's paths did not include that file.

- code: plan.refused.unwritable
  kind: error
  stage: plan
  exit: 12
  message: "{table}.{column} cannot be masked in place: {reason}"
  args: [table, column, reason]

# {reason} carries the parent table of the edge. event.ArgKey has no key for the
# other end of a foreign key (internal/event/event.go), and this message has to
# name both ends and the columns to be actionable, so it borrows {reason} the
# way target.refused.start_timeout above records its own missing key. Owed to
# the task that adds an ArgKey for it (e.g. ArgParent): add the key and
# re-template this message; do not leave a refusal that names one end of an edge.

- code: target.schema.not_recreatable
  kind: error
  stage: plan
  exit: 13
  message: "the foreign key on {table} ({column}) into {reason} cannot be recreated in the target"
  args: [table, column, reason]

# The extract stage (ARCHITECTURE.md §2 "extract, transform, load", §12).
# Extractor.Extract takes no event.Sink -- core.Run is the only producer -- so
# the code below is declared in internal/extract/codes.go beside the *Refusal
# that carries it, and emitted by core from that error. The exit code is
# ADR-005's "7 extract or load".
#
# {reason} carries the server's five-character SQLSTATE, which is an identifier
# and not a value: a PgError's Detail, Where and Hint quote the row and are
# dropped before the refusal is built (THREAT_MODEL.md T4).

- code: extract.refused.standby_cancelled
  kind: error
  stage: extract
  exit: 7
  message: "the source cancelled the read of {table}: the snapshot conflicts with recovery on a standby (SQLSTATE {reason}); retry, or run against the primary"
  args: [table, reason]

# The transform stage (ARCHITECTURE.md §4 and §5). Transformer.Transform takes
# no event.Sink either, so this is declared in internal/transform/codes.go.
#
# ADR-005's exit table names "7 extract or load" and does not name transform
# separately; a masker refusal stops the same movement of rows between the two,
# so it takes the same exit. internal/transform/CLAUDE.md records the reading.
#
# The message names the column and the masker id and never the value: a value
# the masker refused is still a production value, and an error string is a way
# out of the process (THREAT_MODEL.md T4).

- code: transform.refused.masker
  kind: error
  stage: transform
  exit: 7
  message: "masker {reason} refused a value in {table}.{column}: it is not copied through"
  args: [table, column, reason]

# The load stage (ARCHITECTURE.md §11). Loader.Load takes no event.Sink in §2,
# and core.Run is the only producer of events (§7), so the refusals below are
# declared in internal/load/codes.go beside the *load.Refusal that carries them
# and emitted by core from that error. The exit codes are ADR-005's table: 7
# "extract or load", 8 "FK verification".
#
# Two codes are the exception and are sent from inside internal/load, through the
# sink core hands to load.New: §11.1 requires each drop to be printed *before* it
# happens, and a list returned at the end of the stage is a list printed after
# the tables are gone.
#
# {column} carries an index, constraint or sequence name as well as a column
# name: event.ArgKey has no key for any of the three (internal/event/event.go),
# and a refusal that could not name the object it failed on would not be
# actionable. Owed to the task that adds those keys: add them and re-template
# these messages, as target.refused.start_timeout above records its own missing
# key. {reason} carries the server's five-character SQLSTATE, which is an
# identifier and not a value: a PgError's Detail, Where and Hint quote the row
# and are dropped before the refusal is built (THREAT_MODEL.md T4).

- code: load.target.dropping
  kind: info
  stage: load
  message: "dropping {table} in the target"
  args: [table]

- code: load.table.loaded
  kind: progress
  stage: load
  message: "{table}: {count} rows"
  args: [table, count]

- code: load.refused.ddl
  kind: error
  stage: load
  exit: 7
  message: "the target refused the statement that recreates {table} ({column}): SQLSTATE {reason}"
  args: [table, column, reason]

- code: load.refused.copy
  kind: error
  stage: load
  exit: 7
  message: "the rows of {table} did not go in: SQLSTATE {reason}; the table is empty, not half loaded"
  args: [table, reason]

- code: load.refused.fk_invalid
  kind: error
  stage: load
  exit: 8
  message: "the foreign key {column} on {table} does not validate: the slice is missing rows it references"
  args: [table, column]

# The two schema-recreation refusals internal/load/ddl raises (§11.1). §11.1
# raises them at plan -- before the snapshot is used for keys and before
# anything in the target is dropped -- so their stage is plan, beside
# target.schema.not_recreatable above, which internal/plan raises for the other
# case §11.1 names. Exit 13 is ADR-005's "target schema not recreatable".
#
# The stage is where the check belongs and not yet where it runs. internal/plan
# calls its own checkRecreatable, which covers ForeignKey.NotRecreatable and
# nothing else; ddl.Recreatable, which raises the two codes below, is called
# only by load.Load, as its first statement and before the first drop. So the
# target is not destroyed for a schema that cannot be recreated, but the
# refusal currently arrives after the snapshot has been used for keys. Wiring
# it into plan (or into core before the drop) is owed and recorded in
# internal/load/CLAUDE.md; when it lands, this comment goes.
#
# There is deliberately no flag that drops the offending default and carries on:
# the application's first INSERT is the point of the tool. The remedy is the
# load-into-existing-schema mode ADR-005's reversal condition names, deferred
# with an epic in ARCHITECTURE.md §14.

- code: target.schema.not_recreatable.function
  kind: error
  stage: plan
  exit: 13
  message: "{table}.{column} depends on {reason}, a function lazyslice does not recreate in the target"
  args: [table, column, reason]

- code: target.schema.not_recreatable.collation
  kind: error
  stage: plan
  exit: 13
  message: "{table}.{column} uses the collation {reason}, which lazyslice does not recreate in the target"
  args: [table, column, reason]

# The verify stage (ARCHITECTURE.md §6, ADR-005 "Verify"). Verifier.Verify takes
# no event.Sink -- core.Run is the only producer of events (§7) -- so the codes
# below are declared in internal/verify/codes.go: every pipeline.Check in the
# report carries one, and a failing check comes back as a *verify.Refusal core
# renders from here. The exit codes are ADR-005's table: 8 "FK verification", 9
# "residual personal data, or residual hits that could not be confirmed", and 7
# "extract or load" for the two checks that table names no code for -- a row
# count or a sequence that disagrees with the plan is a failure of the movement
# of rows, and internal/verify/CLAUDE.md records the reading.
#
# {reason} carries a fixed phrase from internal/verify/reasons.go, a category
# name or a validator name. It never carries a row value, the candidate a
# confirmation probe was built from, or the value that differed
# (THREAT_MODEL.md T4).
#
# There is deliberately no single "check passed" code with the check's name as
# an argument: pipeline.Check has no free-text field and event.ArgKey has no key
# for a check name, so each check's own line is its own code below.

- code: verify.refused.fk
  kind: error
  stage: verify
  exit: 8
  message: "the foreign key {column} on {table} does not hold: {count} rows reference a parent row the target does not have"
  args: [table, column, count]

- code: verify.refused.residual
  kind: error
  stage: verify
  exit: 9
  message: "a value in {table}.{column} is in the target as the source holds it: the run masked that column and the source still has that value"
  args: [table, column]

- code: verify.refused.residual_unconfirmable
  kind: error
  stage: verify
  exit: 9
  message: "residual hits in {table}.{column} could not be confirmed: {reason}"
  args: [table, column, reason]

- code: verify.refused.second_net
  kind: error
  stage: verify
  exit: 9
  message: "{table}.{column} is not masked and {count} of its values validate as {reason}"
  args: [table, column, count, reason]

- code: verify.refused.row_count
  kind: error
  stage: verify
  exit: 7
  message: "{table} holds {count} rows in the target: {reason}"
  args: [table, count, reason]

- code: verify.refused.sequence
  kind: error
  stage: verify
  exit: 7
  message: "the sequence behind {table}.{column} was not reset: {reason}"
  args: [table, column, reason]

- code: verify.residual.unconfirmed
  kind: warn
  stage: verify
  message: "{count} residual hits in {table}.{column} are absent from the source: a filter false positive, or the source changed since the snapshot"
  args: [table, column, count]

- code: verify.sample.differs
  kind: warn
  stage: verify
  message: "{count} sampled rows of {table} differ from the source in a column the run did not mask: the source changed since the snapshot"
  args: [table, count]

- code: verify.sample.absent
  kind: warn
  stage: verify
  message: "{count} sampled rows of {table} are no longer in the source"
  args: [table, count]

- code: verify.row_count.reported
  kind: info
  stage: verify
  message: "{table} holds {count} rows and the plan gives it no count to check: it is schema-only, or a lookup with no rows in the source"
  args: [table, count]

- code: verify.sequence.unowned
  kind: info
  stage: verify
  message: "the sequence {column} on {table} is owned by no column of it: nothing reset it and nothing checks it"
  args: [table, column]

- code: verify.sample.reported
  kind: info
  stage: verify
  message: "{table} was not sampled: the plan holds no identity keys for it, an identity column is masked, or the source would not open a second transaction"
  args: [table]

- code: verify.fk.passed
  kind: info
  stage: verify
  message: "{count} foreign keys hold over the rows in the target"
  args: [count]

- code: verify.residual.passed
  kind: info
  stage: verify
  message: "{count} masked values were tested against the residual filter and none of them is in the source"
  args: [count]

- code: verify.residual.probes
  kind: info
  stage: verify
  message: "{count} confirmation probes were sent to the source"
  args: [count]

- code: verify.second_net.passed
  kind: info
  stage: verify
  message: "{count} columns the target holds unmasked were scanned and none of them validates as a category"
  args: [count]

- code: verify.row_count.passed
  kind: info
  stage: verify
  message: "{count} steps hold exactly the rows the plan says they hold"
  args: [count]

- code: verify.sequences.passed
  kind: info
  stage: verify
  message: "{count} sequences are set to their column's maximum"
  args: [count]

- code: verify.sample.passed
  kind: info
  stage: verify
  message: "{count} sampled rows match the source in every column the run did not mask"
  args: [count]
