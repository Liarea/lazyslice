# Code catalogue (ARCHITECTURE.md §7).
#
# Every event.Code emitted anywhere in the tree must have a row here; CI fails
# on a code in the tree the catalogue does not carry (internal/event/event.go).
# docs/ERRORS.md is generated from this file by tools/docgen.
#
# Row shape:
#   code:    the event.Code string, dotted "<subject>.<verdict>.<detail>".
#   kind:    one of the event.Kind names (ARCHITECTURE.md §7) — stage_start,
#            stage_done, progress, decision, question, info, warn, error.
#   stage:   the event.Stage name the code is emitted from.
#   exit:    the process exit code (ADR-005), present only for kind: error.
#   message: the rendered template. Placeholders are {argkey}, drawn only
#            from event.ArgKey — a test asserts no template references a key
#            outside that enum. Never a value from a row.
#   args:    the ArgKey names the template uses, for that test to check
#            against.
#
# Scaffold status: only the three codes ADR-008 adds are listed below. The
# rest arrive with the tasks that emit them (internal/event/event.go).

- code: target.refused.unreachable
  kind: error
  stage: discover
  exit: 4
  message: "target {host} did not respond: {reason}"
  args: [host, reason]

- code: target.refused.no_create
  kind: error
  stage: discover
  exit: 4
  message: "role {role} may not create objects in {database}: {statement}"
  args: [role, database, statement]

- code: target.refused.start_timeout
  kind: error
  stage: discover
  exit: 4
  # ADR-008 §6 step 3 requires this message to name the container and
  # "docker logs <name>". Neither is expressible with today's ArgKey enum
  # (internal/event/event.go): ArgStatement is documented there and in
  # ARCHITECTURE.md §7 as SQL rendered from a catalogue template with
  # identifiers substituted, never a docker CLI invocation, and there is no
  # ArgKey for a container name. Owed to the phase 4 task that implements
  # Q1' (ADR-008 §6): add an ArgKey (e.g. ArgContainer) and re-template this
  # message before Q1' ships; do not reuse {statement} for a non-SQL command.
  message: "target container did not become ready after {seconds}s"
  args: [seconds]

# The five gate refusals internal/pg declares (internal/pg/target.go) and could
# not record here, because internal/event/catalogue.yml was not a file that
# task's paths allowed it to write (internal/pg/CLAUDE.md, "Decisions made
# during implementation"). The exit codes are the ones ARCHITECTURE.md §9
# assigns each rule: identity is exit 2, every other refusal is exit 4.

- code: target.refused.same_database
  kind: error
  stage: discover
  exit: 2
  message: "target {database} on {host} is the source database"
  args: [database, host]

- code: target.refused.remote
  kind: error
  stage: discover
  exit: 4
  message: "target {host} is not on this machine: pass {flag} to write to it"
  args: [host, flag]

- code: target.refused.table_cap
  kind: error
  stage: discover
  exit: 4
  message: "target {database} holds {count} user tables, more than lazyslice will check"
  args: [database, count]

- code: target.refused.not_empty
  kind: error
  stage: discover
  exit: 4
  message: "{table} in the target is not empty: {reason}"
  args: [table, reason]

- code: target.refused.probe_failed
  kind: error
  stage: discover
  exit: 4
  message: "could not check the target {database}: {reason}"
  args: [database, reason]

# The classify stage (ARCHITECTURE.md §4). Classifier.Classify takes no
# event.Sink -- it is pure, and core.Run is the only producer -- so the codes
# below are declared in internal/classify/codes.go beside the results that
# produce them and emitted by core from a *pipeline.Classification.
#
# {reason} carries Decision.Reason, which is rendered from the fixed template
# set in internal/classify/reasons.go and parsed back by
# classify.ParseReason: it holds identifiers, category names, type families,
# a closed set of validator phrases and counts, and never a sampled value
# (THREAT_MODEL.md T4, ARCHITECTURE.md §2 "Value-free types").

# The mask-or-copy verdict is carried by the code and not by an argument:
# event.Args has no category or confidence key (internal/event/event.go), so a
# single "decided" code would leave a reader of the --json stream unable to tell
# a masked column from a copied one. internal/invariants/i2_masking_test.go is
# that reader, and its prefix lists ("classify.masked", "classify.copied") are
# where these two spellings come from.

- code: classify.masked.column
  kind: decision
  stage: classify
  message: "{table}.{column}: {reason}"
  args: [table, column, reason]

- code: classify.copied.column
  kind: decision
  stage: classify
  message: "{table}.{column}: {reason}"
  args: [table, column, reason]

- code: classify.column.drift
  kind: warn
  stage: classify
  message: "{table}.{column} is not in {path}: classified fresh and masked at or above possible"
  args: [table, column, path]

# An opt-out is not honoured when the column's type fingerprint has changed
# since it was recorded, and also when it records no fingerprint at all: an
# opt-out nothing can revoke is the fail-open version of THREAT_MODEL.md T3's
# control, so internal/classify treats it as expired rather than as permanent.
# pipeline.Classification.Expired still describes itself as the narrower set;
# that comment is owed the same widening.

- code: classify.column.opt_out_expired
  kind: warn
  stage: classify
  message: "the opt-out on {table}.{column} is not honoured: it records no type fingerprint, or the column's type changed"
  args: [table, column]

- code: classify.refused.strict_schema
  kind: error
  stage: classify
  exit: 10
  message: "{count} columns are not in {path} and {flag} is set"
  args: [count, path, flag]

# The plan stage (ARCHITECTURE.md §3). Planner.Plan takes no event.Sink -- it is
# pure, and core.Run is the only producer -- so the codes below are declared in
# internal/plan/codes.go beside the *plan.Refusal that carries them, and emitted
# by core from that error. Exit codes are ADR-005's table: 2 usage, 11 budget,
# 12 plan refused, 13 target schema not recreatable.
#
# {flag} carries a flag spelling with identifiers substituted, such as
# "--key public.click_stream=col,col or --skip-table public.click_stream". It is
# built from the table's own name and never from a row (THREAT_MODEL.md T4).

- code: plan.refused.no_root
  kind: error
  stage: plan
  exit: 2
  message: "{flag} names no table in the source"
  args: [flag]

- code: plan.refused.key_column
  kind: error
  stage: plan
  exit: 2
  message: "{flag} on {table} names {column}, which is not a column of it or is a system column: there is no ctid rung"
  args: [table, column, flag]

- code: plan.refused.key_not_unique
  kind: error
  stage: plan
  exit: 12
  message: "{flag} does not identify a row in {table}: at least one key appears more than once"
  args: [table, flag]

- code: plan.refused.no_identity
  kind: error
  stage: plan
  exit: 12
  message: "{table} has no row identity: pass {flag}"
  args: [table, flag]

- code: plan.refused.unreadable
  kind: error
  stage: plan
  exit: 12
  message: "{role} cannot read {table}, which the slice needs as a parent: {statement}"
  args: [table, role, statement]

- code: plan.refused.skip_parent
  kind: error
  stage: plan
  exit: 12
  message: "{flag} cannot drop {table}: the slice needs it as a parent and would not be referentially complete without it"
  args: [table, flag]

- code: plan.refused.row_budget
  kind: error
  stage: plan
  exit: 11
  message: "{table} takes the slice past {count} rows: raise {flag}, or lower --take, --cap or --depth"
  args: [table, count, flag]

- code: plan.refused.memory_budget
  kind: error
  stage: plan
  exit: 11
  message: "{table} takes the estimated key and filter memory past {count} bytes: raise {flag}, or lower --take, --cap or --depth"
  args: [table, count, flag]

# {reason} carries the parent table of the edge. event.ArgKey has no key for the
# other end of a foreign key (internal/event/event.go), and this message has to
# name both ends and the columns to be actionable, so it borrows {reason} the
# way target.refused.start_timeout above records its own missing key. Owed to
# the task that adds an ArgKey for it (e.g. ArgParent): add the key and
# re-template this message; do not leave a refusal that names one end of an edge.

- code: target.schema.not_recreatable
  kind: error
  stage: plan
  exit: 13
  message: "the foreign key on {table} ({column}) into {reason} cannot be recreated in the target"
  args: [table, column, reason]
