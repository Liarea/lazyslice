# The embedded rule pack (ARCHITECTURE.md §4).
#
# This file is compiled into the binary by internal/classify/rulepack.go. It is
# not loadable at runtime and there is no flag that points at another copy of
# it: the classifier is not pluggable (ADR-006), because a pluggable classifier
# is a supported way to see less personal data. Changing a rule here changes
# Classification.Fingerprint, which is printed as "classification changed —
# masked values will differ" (ARCHITECTURE.md §5 "Determinism scope"), so a
# change to this file is a release note rather than a tidy-up.
#
# Row shape:
#   categories: one row per pipeline.Category that a column can be masked
#     under. `masker` is the mask.ID the decision carries; `accepts` is the
#     type-family list ARCHITECTURE.md §4 "Accepted types per category"
#     requires — a name hit on a type outside it is recorded at `low` with a
#     reason naming the conflict and is never raised by the neighbouring-column
#     rule. `["*"]` accepts every family, which only `special_category` does:
#     it is scored `certain` by name alone and testdata/README.md trap 24 masks
#     it on an enum.
#   patterns: one row per name rule. `match` is a regexp over the *normalised*
#     column name (lower case, camelCase split on, digits split off), so
#     "EmailAddress" is matched as "email_address". `name` is what the reason
#     line prints as {pattern} and is the only part of a rule that reaches a
#     rendered string. `priority` breaks a tie when two rules match one name:
#     ip_address is network_id and not address, email_address is email and not
#     address, and password_hash is credential and not person_name. Two
#     optional fields (T-0313): `unless` is a regexp over the same normalised
#     column name that takes the column out of the rule altogether, so a lower
#     rule can still match it; `corroborated_by` is a regexp over the
#     normalised table name and the normalised column name, and a rule that
#     carries one reaches `possible` only when it matches either, or when the
#     samples corroborate the rule instead — see bare_name below, the one rule
#     that has it.
#   table_patterns: one row per table-scoped name rule (T-0119): `table` is a
#     regexp over the normalised *table* name, `match` is a regexp over the
#     normalised *column* name exactly as in patterns: above, and `priority`
#     shares patterns:'s number line, so a table-scoped rule and a name rule
#     matching the same column resolve the same tie-breaking way (priority,
#     then rule name) as two name rules do. A table-scoped rule is tried only
#     within a table its own `table` regexp matches; against every other table
#     it does not exist, which is what lets it name a column a bare word rule
#     could never say without mismasking every other schema's join keys — see
#     the refresh_token_parent rule below.
#   tables: name rules over the *table*, not the column.
#
# The type families are the ones internal/classify/types.go maps
# pg_catalog.format_type output onto; an unrecognised type is "other" and is
# accepted by no category.

version: "1"

categories:
  - category: email
    masker: email
    accepts: [text, varchar, bpchar, citext]
  - category: person_name
    masker: person_name
    accepts: [text, varchar, bpchar, citext]
  - category: phone
    masker: phone
    accepts: [text, varchar, bpchar, citext, bigint, integer, numeric]
  - category: address
    masker: address
    accepts: [text, varchar, bpchar, citext]
  - category: geo
    masker: geo
    accepts: [text, varchar, bpchar, citext, numeric, float]
  - category: person_date
    masker: person_date
    accepts: [date, timestamp, text, varchar, bpchar]
  - category: national_id
    masker: national_id
    accepts: [text, varchar, bpchar, citext, bigint, integer, numeric]
  - category: financial_account
    masker: financial_account
    accepts: [text, varchar, bpchar, citext, bigint, integer, numeric]
  - category: network_id
    masker: network_id
    accepts: [inet, cidr, macaddr, text, varchar, bpchar, citext]
  - category: online_id
    masker: online_id
    accepts: [text, varchar, bpchar, citext, uuid]
  - category: credential
    masker: "fixed:$lazyslice$invalid"
    accepts: [text, varchar, bpchar, citext, bytea]
  - category: free_text
    masker: free_text
    accepts: [text, varchar, bpchar, citext]
  - category: special_category
    masker: special_category
    accepts: ["*"]
  - category: binary_personal
    masker: "null"
    accepts: [bytea]
  - category: semi_structured
    masker: semi_structured
    accepts: [json, jsonb, hstore]
  # A column the database derives from other columns' text. It has no name
  # pattern and cannot be reached by one: internal/classify decides it on the
  # type alone, always, because a tsvector holds the lexemes of the text it was
  # built from and that text may itself be masked (T-0054). The masker emits
  # ''::tsvector.
  - category: derived_text
    masker: derived_text
    accepts: [tsvector]

patterns:
  # Special categories are scored `certain` by name alone (ARCHITECTURE.md §4),
  # so they outrank every other rule on a name that matches both.
  - name: special_category
    category: special_category
    priority: 90
    match: '(^|_)(marital(_?status)?|ethnicity|ethnic(_?origin)?|race|religion|religious(_?belief)?|sexual(_?orientation)?|sexuality|gender(_?identity)?|health(_?condition)?|diagnos[ei]s|disabilit(y|ies)|biometrics?|genetics?|dna|trade_?union|union_?membership|political(_?(views?|affiliation|party))?|criminal(_?record)?|convictions?|pregnan(t|cy)|hiv|medical(_?history)?|blood_?type|allerg(y|ies)|medications?|prescriptions?|immigration_?status|asylum|refugee)(_|$)'

  # The second half of this alternation is the spellings a real authentication
  # schema uses (T-0104). docs/TORTURE.md's hand-labelled truth set over
  # supabase-auth measured recall 0.800 and every one of the ten misses was a
  # name this pattern did not cover (it is 0.980 there now, one miss left, and
  # precision moved up rather than down: 0.645 to 0.671): an OAuth authorization code, a one-time
  # code, a recovery code's hash, the secret half of PKCE and a WebAuthn
  # credential id. A bare `codes?` is deliberately NOT here: it would match
  # country_code, postal_code, currency_code and status_code, and at priority 80
  # it would take a postal code away from the address rule and mask it to the
  # fixed literal.
  #
  # `public_?keys?` IS here, and that is a decision taken rather than a pattern
  # widened (T-0121, settled 2026-09-09; T-0104 named it one of two columns that
  # "deserve a decision rather than a pattern"). The two readings pull opposite
  # ways: a public key is published by design -- mastodon puts it in the actor
  # document and WebAuthn hands it to every relying party -- so it is not a
  # secret; but it is also a stable identifier for exactly one person, which is
  # the online_id argument. It goes to credential because *a key that identifies
  # a person is personal data, and masking it costs nothing a development
  # database needs*: nothing local verifies a WebAuthn assertion or fetches an
  # actor document, so a per-account key replaced by the unusable literal breaks
  # no local flow, while copying it ships a per-person identifier that outlives
  # every other value in the row. Under a unique index it escalates to
  # credential_unique (mask/gen_credential.go) rather than refusing, which is
  # why the wide-domain online_id argument no longer buys anything the plan
  # needs. The hand labels this rule is scored against moved with it, in
  # names_test.go and supabase_misses_test.go, and the rates are recorded in
  # docs/TORTURE.md.
  - name: credential
    category: credential
    priority: 80
    match: '(^|_)(passwords?|passwd|pwd|password_?hash|password_?digest|encrypted_?password|salts?|secrets?|api_?keys?|access_?tokens?|refresh_?tokens?|auth_?tokens?|tokens?|token_?digests?|private_?keys?|client_?secrets?|otp_?secrets?|totp_?secrets?|recovery_?codes?|signing_?keys?|encryption_?keys?|auth_?codes?|otp_?codes?|authorization_?codes?|code_?verifiers?|code_?challenges?|code_?hash(es)?|credential_?ids?|public_?keys?)(_|$)'

  - name: national_id
    category: national_id
    priority: 75
    match: '(^|_)(ssn|social_?security(_?numbers?)?|national_?ids?|national_?insurance(_?numbers?)?|nino|nhs_?numbers?|tax_?ids?|passports?|passport_?numbers?|driver_?licen[sc]es?|drivers_?licen[sc]es?|licen[sc]e_?numbers?|id_?card(_?numbers?)?|personnummer|dni|nif|cpf|cnpj|aadhaar|pesel|codice_?fiscale|bsn|curp|rut|nir|amka|afm|henkilotunnus|hetu)(_|$)'

  - name: financial_account
    category: financial_account
    priority: 70
    match: '(^|_)(ibans?|bics?|swift_?codes?|sort_?codes?|account_?numbers?|bank_?accounts?|card_?numbers?|credit_?cards?|debit_?cards?|cardholders?|cvv|cvc|routing_?numbers?|bank_?codes?)(_|$)'

  - name: email
    category: email
    priority: 65
    match: '(^|_)(e_?mails?|e_?mail_?address(es)?|mails?|emls?|correos?|correo_?electronico|courriels?|e_?posts?|posta_?elettronica)(_|$)'

  - name: phone
    category: phone
    priority: 60
    match: '(^|_)(phones?|phone_?numbers?|telephones?|tel|mobiles?|mobile_?numbers?|mobs?|cell|cellphones?|msisdn|faxe?s?|whatsapp|contact_?numbers?|telefones?|telefonos?|telefon|telefoonnummers?|komorka|komórka|handy|gsm|puhelin|kotinumero|kontaktnummers?|mobilnummers?)(_|$)'

  - name: network_id
    category: network_id
    priority: 58
    match: '(^|_)(ips?|ipv_?4|ipv_?6|ip_?address(es)?|macs?|mac_?address(es)?|remote_?addr)(_|$)'

  - name: person_date
    category: person_date
    priority: 55
    match: '(^|_)(birth_?dates?|date_?of_?birth|dob|birthdays?|birth|born_?on|deceased_?at|death_?dates?|date_?of_?death|fecha_?de_?nacimiento|geburtsdatum)(_|$)'

  - name: geo
    category: geo
    priority: 50
    match: '(^|_)(latitudes?|longitudes?|lat|lng|lon|geo|geolocations?|coordinates?|coords?|gps)(_|$)'

  - name: binary_personal
    category: binary_personal
    priority: 48
    match: '(^|_)(photos?|pictures?|avatars?|profile_?images?|selfies?|signatures?|fingerprints?|id_?scans?)(_|$)'

  - name: address
    category: address
    priority: 45
    match: '(^|_)(address(es)?|address_?lines?|street(_?address)?|streets?|city|cities|town|postal_?codes?|postcodes?|zips?|zip_?codes?|district|county|province|locality|locations?|suburb|direccion|adresse|adres|anschrift|wohnort|indirizzo|endereco|osoite|ulica|miasto|kaupunki|postnummer)(_|$)'

  - name: online_id
    category: online_id
    priority: 40
    match: '(^|_)(usernames?|user_?names?|nicknames?|screen_?names?|handles?|logins?|account_?names?|twitter|facebook|instagram|linkedin|skype|telegram|discord|mastodon|websites?|urls?|homepages?|profile_?urls?|device_?ids?|advertising_?ids?|imei|imsi|cookie_?ids?)(_|$)'

  # external_id, provider_id and extern_uid are the identifiers an identity
  # provider issues for a person -- Supabase's identities.provider_id and
  # scim_users.external_id, GitLab's identities.extern_uid (T-0104). They are
  # online_id and not credential because they are not secret: they name a person
  # at the IdP, and online_id's masker has a domain wide enough for the unique
  # index they usually carry.
  #
  # **This rule is anchored to the whole name** and is the only one in this file
  # that is, which is why it is a separate row rather than three more
  # alternatives above. Every other name rule is a word rule -- `(^|_)word(_|$)`
  # -- and under that spelling `provider_?ids?` also matches `sso_provider_id`,
  # `oauth_provider_id` and `identity_provider_id`, which are join keys and not
  # people: testdata/torture/supabase-auth has five uuid `sso_provider_id`
  # columns, each a foreign key to `sso_providers(id)`. online_id accepts uuid
  # (for device_id and cookie_id), so a compound name reaches `possible` on the
  # name alone and the report would call a join key an online_id. Anchoring keeps
  # the three names T-0104 asked for and leaves the compound spellings `none`.
  #
  # The orphan this rule used to cause is fixed elsewhere and not here (T-0120,
  # keyChildren in classify.go): a key-family child whose parent end is an exempt
  # surrogate key takes the exemption back, so a column called exactly
  # `provider_id` on a uuid foreign key is copied with both the name signal and
  # the parent key on its reason line. This anchor is therefore about the
  # *category on the line*, not about masking: `sso_provider_id` is not an
  # identifier an IdP issued for a person, whether or not it is masked, and a
  # compound spelling on a column with no foreign key at all is the case no
  # reconciliation can reach.
  - name: online_id_idp
    category: online_id
    priority: 40
    match: '^(external_?ids?|provider_?ids?|extern_?uids?)$'

  - name: person_name
    category: person_name
    priority: 35
    # The non-English half was added by the 2026-09-15 red team's A1: a
    # `klienci` table whose `nazwisko`, `imie`, `cognome` and `achternaam`
    # columns reached the target verbatim, because the rules were only
    # accidentally multilingual (they already carried apellido, nombre,
    # nachname, vorname and prenom, and nothing else). `f_name`/`l_name` and
    # `fname`/`lname` are the abbreviation half of the same attack.
    #
    # This is a patch and not a fix, and the difference is worth stating where
    # the patch lives: no rule pack is ever complete, so the control that
    # actually closes the class is the multilingual value dictionary in
    # internal/textsig/names.txt, which both nets read. THREAT_MODEL.md T1
    # records what a name rule alone still misses.
    #
    # The bare word `name`, and `display_name`, are not in this row any more:
    # they are bare_name, below (T-0313). A qualifier that says the name is a
    # person's is in this row instead, so it keeps `possible` on the name
    # alone and never waits on corroboration: legal, preferred, nick, birth,
    # married, holder and cardholder, billing and shipping, `name_on_card`,
    # and the reversed spellings `name_given`, `name_family`, `name_first`,
    # `name_last`, `name_middle` (T-0313 review). Each is spelled with the
    # underscore before or after `name`, so this row masks exactly the
    # qualified names the bare `names?` word masked before T-0313 and no
    # others: a run-together `nickname` is not a new match here.
    match: '(^|_)(legal_names?|preferred_names?|nick_names?|birth_names?|married_names?|holder_names?|card_?holder_names?|billing_names?|shipping_names?|name_on_card|name_(given|family|first|last|middle)|first_?names?|last_?names?|given_?names?|family_?names?|middle_?names?|sur_?names?|full_?names?|maiden_?names?|real_?names?|forenames?|f_?names?|l_?names?|apellidos?|nombres?|nachname|familienname|vorname|prenom|nazwisko|imie|imię|cognome|achternaam|voornaam|naam|efternamn|förnamn|sukunimi|etunimi|sobrenome|navn|fornavn|etternavn|familia)(_|$)'

  # T-0313, dogfood session 1: on a production Rails schema, 38 columns called
  # just `name` -- tags, folders, playlists, widgets, roles, languages, AI
  # models, triggers -- and every `*_file_name` column (Paperclip's
  # `logo_file_name`, `transcode_file_file_name`) were masked as person_name
  # by the bare `names?` word this rule pack used to carry in the row above,
  # and two of them, under unique indexes, refused the plan. The bare word
  # says a column holds *a* name, not *a person's* name, so it is its own row
  # now and it needs corroboration before it reaches `possible`
  # (internal/classify's decide, bareNameVerdict):
  #
  #   - `corroborated_by` is a word for people, matched against the
  #     normalised table name and the normalised column name alike: users,
  #     customers, staff... as the table (`users.name`), or as the column's own
  #     qualifier (`orders.customer_name`). Either is enough. The list errs
  #     wide: `clients` and `agents` also name OAuth clients and AI agents,
  #     whose names are labels, and they are here anyway because a CRM's
  #     `clients.name` is the commoner shape and a missed person is the
  #     failure that cannot be undone (T-0313 review).
  #   - otherwise the column's samples: at least nameCorroborationThreshold of
  #     them carrying a word from internal/textsig/names.txt.
  #   - otherwise, with fewer than minSamples samples, the name alone decides,
  #     exactly as before: an unproven column is not a clean one.
  #
  # A bare name with none of the three is recorded at `low`, which the
  # neighbouring-column rule still raises beside a `likely` column, and is
  # copied otherwise. A person's name in such a column that the dictionary
  # cannot carry (a non-Latin script, a name it does not list) is then
  # THREAT_MODEL.md T1's stated residual, as a non-Latin name already was.
  #
  # `unless` takes a column out of this rule altogether: a file name is a
  # label, never a person's name, whatever table it sits in.
  #
  # `corroborated_by` is accepted on a person_name rule only, because the name
  # dictionary is the only value evidence that could corroborate it.
  - name: bare_name
    category: person_name
    priority: 34
    match: '(^|_)(names?|display_?names?)(_|$)'
    unless: '(^|_)file_?names?(_|$)'
    corroborated_by: '(^|_)(users?|people|persons?|customers?|contacts?|employees?|members?|staff|staffers?|authors?|accounts?|profiles?|owners?|admins?|administrators?|patients?|students?|pupils?|teachers?|guests?|visitors?|attendees?|participants?|subscribers?|applicants?|candidates?|recipients?|senders?|passengers?|travell?ers?|donors?|volunteers?|residents?|beneficiar(y|ies)|clients?|players?|drivers?|agents?|tenants?|landlords?|workers?|artists?|speakers?|actors?|holders?|sellers?|riders?|parents?|mothers?|fathers?|guardians?|spouses?|individuals?|citizens?|cardholders?|leads?|prospects?|creators?|assignees?|reporters?|reviewers?|signers?|signator(y|ies)|inviters?|invitees?|referrers?|followers?|friends?|managers?|doctors?|physicians?|nurses?|clinicians?|practitioners?|therapists?|instructors?|tutors?|learners?|mentors?|mentees?|buyers?|shoppers?|borrowers?)(_|$)'

  - name: free_text
    category: free_text
    priority: 20
    match: '(^|_)(notes?|comments?|descriptions?|bio|biography|messages?|body|reasons?|remarks?|memo|content|contents|text|raw|cooked|excerpts?|summary)(_|$)'

table_patterns:
  # T-0119: refresh_tokens.parent holds another refresh token, in a column
  # named after a tree edge. A name rule matching `parents?` would match
  # parent_id in every schema there is, at priority 80, and mask half a
  # database's join keys to the fixed literal — patterns: above sees the
  # column name alone, so "parent, in a table called refresh_tokens" is not a
  # rule it can express. This is the first row this section has ever needed:
  # docs/TORTURE.md's supabase-auth truth set carried it as the one remaining
  # false negative, and it is what the priority and the name here are measured
  # against there.
  - name: refresh_token_parent
    category: credential
    priority: 80
    table: '(^|_)refresh_?tokens?(_|$)'
    match: '^parents?$'

tables:
  # ARCHITECTURE.md §4: "any jsonb in a table named like audit|log|history|event"
  # replaces the document with {} rather than walking it leaf by leaf
  # (testdata/README.md trap 16b).
  log_shaped: '(^|_)(audit|audits|log|logs|history|histories|event|events|activity|activities|trace|traces)(_|$)'
