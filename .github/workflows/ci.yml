name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.13.2

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # The masker is a nested module (ADR-006) with its own go.mod, so it is
      # linted separately against the same configuration.
      - name: lint (root module)
        uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --config ${{ github.workspace }}/.golangci.yml

      - name: lint (mask module)
        uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: mask
          args: --config ${{ github.workspace }}/.golangci.yml

      - name: go.mod is tidy
        run: |
          go mod tidy
          (cd mask && go mod tidy)
          git diff --exit-code -- go.mod go.sum mask/go.mod mask/go.sum

      # research/LICENSE_DECISION.md recommendation 1: the licence is carried
      # per-file by an SPDX header. `make lint` runs this too; it is named
      # separately here so a missing header reads as a licence failure rather
      # than as a lint failure.
      - name: every Go file carries its licence identifier
        run: make spdx

  # The release config's first execution must not be the tag itself.
  #
  # goreleaser creates the GitHub release before it reaches the cask publish
  # pipe, so a configuration error discovered at tag time leaves a published
  # tag with a half-finished release behind it — the outcome .goreleaser.yaml's
  # skip_upload comment says it exists to avoid. A snapshot build takes about
  # three seconds and turns every one of those into a pull-request failure.
  #
  # The assertions are the things that have actually been wrong here, or that
  # a config change to this file could get wrong next: an archive with no
  # LICENSE (Apache-2.0 §4(a) requires the licence to reach every recipient),
  # a cask with no postflight (unsigned, un-notarized binaries are killed by
  # Gatekeeper, so `brew install` succeeds and `lazyslice --version` does
  # not), a build that produced fewer than the six platforms .goreleaser.yaml
  # names, and an sboms pipe that silently produced fewer documents than
  # archives or that goreleaser did not list in checksums.txt.
  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # `make tools` and `make snapshot` rather than the commands themselves,
      # so the Makefile holds the only pin of the goreleaser version and the
      # only spelling of the snapshot build. Repeating either here is how this
      # job comes to validate a different goreleaser than `make snapshot` runs
      # on a laptop — the exact drift it was added to catch.
      - name: install the pinned build tools
        run: make tools

      # syft, for the sboms pipe in .goreleaser.yaml (THREAT_MODEL.md T10's
      # "published SBOM"). release.yml installs the same pinned action; a
      # laptop's `make snapshot` still skips the pipe by default (Makefile's
      # SNAPSHOT_SKIP), because the config's first execution must not be the
      # tag itself, and until this step the sboms pipe had no execution at
      # all before one.
      - uses: anchore/sbom-action/download-syft@v0.24.2

      - name: the config is valid
        run: bin/tools/goreleaser check

      # SNAPSHOT_SKIP=sign, not the Makefile default of sign,sbom: this job
      # exists so a configuration error is a pull-request failure rather than
      # a burned tag, and the sboms pipe is exactly as able to be
      # misconfigured as the six-archive build above it.
      - name: the release builds
        run: SNAPSHOT_SKIP=sign make snapshot

      - name: and what it built is what we promised
        run: |
          set -euo pipefail

          # `|| true` because a build that produced nothing must reach the
          # message below rather than abort the script under `set -e`.
          archives=$( { ls dist/lazyslice_*_*.tar.gz dist/lazyslice_*_*.zip 2>/dev/null || true; } | wc -l)
          if [ "$archives" -ne 6 ]; then
            echo "release-config: $archives archive(s), want 6 (darwin/linux/windows x amd64/arm64)"
            ls -1 dist/ || true
            exit 1
          fi

          sboms=$( { ls dist/lazyslice_*_*.tar.gz.sbom.json dist/lazyslice_*_*.zip.sbom.json 2>/dev/null || true; } | wc -l)
          if [ "$sboms" -ne 6 ]; then
            echo "release-config: $sboms sbom document(s), want 6 — one per archive"
            echo "(.goreleaser.yaml's sboms pipe, THREAT_MODEL.md T10's 'published SBOM')."
            ls -1 dist/ || true
            exit 1
          fi
          for f in dist/lazyslice_*_*.tar.gz.sbom.json dist/lazyslice_*_*.zip.sbom.json; do
            name=$(basename "$f")
            if ! grep -qF "$name" dist/checksums.txt; then
              echo "release-config: $name is not listed in dist/checksums.txt"
              exit 1
            fi
          done

          # The cask still renders as the deprecated `postflight` stanza
          # (Homebrew 7.0.0, 2026-09-13,
          # https://brew.sh/2026/09/13/homebrew-7.0.0/, "Install steps":
          # third-party taps get a warning until 2027-12-11, then rejection)
          # because goreleaser has no `hooks.post.install_steps` to emit it
          # with yet (https://goreleaser.com/customization/homebrew_casks/,
          # v2.18.2 as of 2026-09-22; the PR that would add it,
          # https://github.com/goreleaser/goreleaser/pull/6873, is still
          # open). T-0277 tracks the switch once that ships; until then this
          # still has to assert `postflight`, not `postflight_steps` — a
          # future goreleaser upgrade that quietly starts emitting
          # `postflight_steps` should make this grep start failing, which is
          # the prompt to update .goreleaser.yaml's comment and this
          # assertion together, not to widen the grep to match either.
          cask=dist/homebrew/Casks/lazyslice.rb
          if ! grep -q 'postflight' "$cask"; then
            echo "release-config: the generated cask has no postflight, so the binary it installs carries"
            echo "com.apple.quarantine and macOS kills it on first run. Restore the hooks.post.install"
            echo "block in .goreleaser.yaml's homebrew_casks entry."
            exit 1
          fi
          if grep -q 'postflight_steps' "$cask"; then
            echo "release-config: the cask now renders postflight_steps, not postflight — goreleaser"
            echo "apparently gained hooks.post.install_steps (T-0277, goreleaser#6873). Update this"
            echo "assertion and .goreleaser.yaml's comment above the hooks block to match, then close T-0277."
            exit 1
          fi
          if ! grep -q 'com.apple.quarantine' "$cask"; then
            echo "release-config: the cask's postflight does not remove com.apple.quarantine"
            exit 1
          fi

          for archive in dist/lazyslice_*_darwin_arm64.tar.gz dist/lazyslice_*_linux_amd64.tar.gz; do
            # The listing is captured first, not piped: under `pipefail`,
            # `tar tzf | grep -q` fails whenever grep finds LICENSE and exits
            # before tar has finished writing ("tar: stdout: write error"),
            # and the step then reports a licence that is there as missing
            # (run 35262652634, 2026-09-17).
            listing=$(tar tzf "$archive")
            if ! grep -qx 'LICENSE' <<<"$listing"; then
              echo "release-config: $archive contains no LICENSE. archives.files REPLACES goreleaser's"
              echo "defaults, so LICENSE has to be named there; Apache-2.0 section 4(a) requires every"
              echo "recipient of the work to get a copy of the licence, and a tag is immutable."
              exit 1
            fi
          done

          echo "release-config: 6 archives, 6 sboms in checksums.txt, a quarantine-removing postflight, LICENSE in the archives"

  # CLAUDE.md's hardest rule, enforced over the whole tree rather than over the
  # registered flags of one command tree, which is all a Go test can see.
  forbidden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: no flag, field, key or variable turns masking off
        run: make forbidden

  # T-0285: proves `go install github.com/Liarea/lazyslice/cmd/lazyslice`
  # resolves github.com/Liarea/lazyslice/mask from the tagged module the
  # proxy serves rather than from this tree's own `go.work` or a `replace`
  # directive. `make install-proof` builds a copy of the checked-out tree
  # with mask/ and go.work removed and a fresh GOMODCACHE — the same shape
  # `go install` runs outside this tree, and proven against a reintroduced
  # `replace` by the target's own negative control — rather than
  # `go install ...@$GITHUB_SHA`: the commit under test is not tagged and
  # has no public go.sum entry yet, so the only thing a real `go install` of
  # it could prove here is that the proxy has *not* heard of it. Not part of
  # `make check`: a fresh GOMODCACHE re-downloads every dependency, which
  # measured over ten seconds warm on a laptop, too slow for every push.
  install-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: go install resolves the mask module without go.work or a replace (T-0285)
        run: make install-proof

      # T-0285 review: go.work at the repo root makes every ordinary build
      # and test in this tree (this job's own `install-proof` target aside,
      # which builds a mask/-free copy) compile mask/ from the workspace
      # directory rather than from the version go.mod requires, because a
      # workspace member always wins. The `test` job below never sets
      # GOWORK=off, so it is silent on that gap. This step is: does the
      # test suite even build and pass against the *versioned* mask, with
      # go.work out of the way, on the actual checkout (not install-proof's
      # scratch copy, so this also stands in for `go vet`/`go test`
      # ordinary compilation, which install-proof does not exercise). It
      # does not reach goreleaser's own build (.goreleaser.yaml, outside
      # this task's authorized paths; tracked in tools/tracker.py as
      # follow-up work — see mask/CLAUDE.md and docs/RUNBOOK.md).
      - name: build and test against the versioned mask module, go.work out of the way (T-0285)
        run: |
          GOWORK=off go build ./...
          GOWORK=off go test -race -count=1 ./...

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: build
        run: go build ./...
      - name: test (root module)
        run: go test -race -count=1 ./...
      - name: test (mask module)
        working-directory: mask
        run: go test -race -count=1 ./...

  # The tests that matter are statements about a real Postgres, so they run
  # against containers on a runner with a Docker daemon, on every supported
  # major (ADR-003: "Phase 4 CI runs 14 and 18; Gate 5 requires the full
  # matrix" — phase 5 is where this file is that full matrix).
  # testcontainers-go makes the five containers a loop, not five configs.
  #
  # This job blocks a merge: `make integration` decides it, and any failing
  # test fails it. It once carried a wrapper that allowed
  # TestI2NothingFlaggedSurvives and TestI6RootHoldsTakeRows to fail while
  # T-CORE's findings were open (the low-cardinality leak, the derived_text
  # exemption and pagila's counted root); T-0058 closed all three and the
  # allowlist is gone. A test that fails here is a failure, not an expectation.
  # `continue-on-error` is not used either, because it makes every step's
  # outcome irrelevant to the job's conclusion — a run that failed to compile,
  # or that found no Docker daemon and skipped everything, reported the same
  # green as a correct one.
  #
  # See ARCHITECTURE.md section 5's note on documentation-range IP output:
  # fixtures avoid documentation-range IPv4 source values so that
  # TestI2NothingFlaggedSurvives cannot coincidentally collide with
  # network_id's output space (T-0059).
  #
  # The three guards that survive the wrapper need `-v`, because `go test`
  # prints one `ok` line per package and no per-test line without it: a run that
  # executed nothing, and a run whose every test skipped for want of a Docker
  # daemon (internal/testutil.SkipWithoutDocker), both exit 0. That is the
  # failure internal/invariants/harness_test.go warns about in its own comment —
  # "a suite that skips when the thing it tests does not exist reports green on
  # an empty repository" — one layer up.
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["14", "15", "16", "17", "18"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: docker is available
        run: docker version
      - name: integration
        env:
          LAZYSLICE_TEST_POSTGRES_IMAGE: postgres:${{ matrix.postgres }}
          # internal/discover/provision's readiness budget (its ReadyBudgetEnv).
          # The default is 60 s — the number ARCHITECTURE.md section 9 and
          # ADR-008 section 6 both carry, which is a laptop with a warm cache; a
          # runner here pulls the image cold and then runs several initdbs at
          # once against a shared disk, and a budget that is tight enough to
          # expire on a slow runner turns a flake into a red merge. It is a
          # *timeout* and not a wait: a container that comes up in two seconds
          # still takes two seconds, and one that dies during startup is now
          # reported the moment it dies rather than at the end of the budget
          # (tracker T-0075).
          LAZYSLICE_PROVISION_READY_TIMEOUT: 3m
        run: |
          set -uo pipefail
          # -v, because `go test` prints no per-test line and no t.Skipf reason
          # at all without it: the output of a package whose tests all pass or
          # all skip is one `ok` line, so neither the skip-reason grep nor the
          # "executed nothing" guard below could ever match.
          #
          # The suite's own exit code is the job's. `pipefail` is what makes the
          # pipe into tee report make's status rather than tee's, and the
          # `|| status=$?` is what keeps the runner's own `set -e` from ending
          # the step there — the guards below have to run on a failing run too,
          # because "no Docker daemon" and "did not compile" are the two ways a
          # green exit means nothing. They can only turn a green run red.
          status=0
          make integration GOTESTFLAGS=-v 2>&1 | tee integration.log || status=$?
          # The positive signal, and the one that outlives every expectation: a
          # run that executed nothing at all cannot satisfy it.
          ran=$(grep -cE '^\s*--- (PASS|FAIL): ' integration.log || true)
          if [ "$ran" -eq 0 ]; then
            echo "::error::the integration suite executed no test: no '--- PASS' or '--- FAIL' line in"
            echo "::error::$(wc -l < integration.log) line(s) of -v output. Nothing was asserted."
            status=1
          fi
          # Not a bare `--- SKIP` grep: `make integration` runs ./... and
          # several tests over the whole tree skip by design on an ordinary
          # run. internal/load's TestChildLoadsUntilKilled skips on every one
          # of them — it is the re-exec child half of the kill -9 test and is a
          # test only so the parent can run this binary again — so a bare grep
          # fails the job on every PR while printing "no reachable Docker
          # daemon" about a run that asserted 400-odd tests.
          #
          # The thing worth catching has one spelling: testutil.SkipWithoutDocker
          # (internal/testutil/postgres.go), the gate every docker-dependent
          # package calls. Matching its two skip reasons is narrower than the
          # invariants package and also wider in the way that matters — it
          # catches the same silent green in internal/load, internal/extract,
          # internal/pg, internal/plan, internal/verify and internal/introspect.
          if grep -qE 'testutil: (no container provider|docker is not reachable)' integration.log; then
            echo "::error::testutil.SkipWithoutDocker skipped at least one test, so this run had no"
            echo "::error::reachable Docker daemon and asserted nothing:"
            grep -E 'testutil: (no container provider|docker is not reachable)' integration.log |
              head -n 3 | sed 's/^/::error::  /'
            status=1
          fi
          if grep -qE 'build failed|cannot find package' integration.log; then
            echo "::error::the integration suite did not compile, so nothing was asserted."
            status=1
          fi

          if [ "$status" -eq 0 ]; then
            echo "integration: $ran test(s) ran and every one of them passed"
          fi
          exit "$status"

  # THREAT_MODEL.md T4, tracker T-0270: the binary "opens exactly three kinds
  # of connection — the source, the target, and the Docker socket" and has
  # "no telemetry, update check, model call or registry". tools/egress/run.sh
  # (via `make egress`) is the test that proves the network half of that: it
  # runs the binary inside a container that holds NET_ADMIN, under an
  # iptables OUTPUT policy that accepts loopback, established traffic and the
  # source and target Postgres addresses on 5432 and counts-then-rejects
  # everything else, then proves its own counter counts with a negative
  # control. Blocking, on the same triggers as `integration` above, for the
  # same reason: a rail this load-bearing is worth a pull request failing on.
  egress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: docker is available and can grant NET_ADMIN
        run: docker version
      - name: egress (THREAT_MODEL.md T4)
        run: make egress

  # T-0140: docs/reviews/2026-09-09/REVIEW.md, "Release reality" — this
  # workflow ran `make integration` but never `make torture`, so a green `ci`
  # run did not mean the ten real schemas of testdata/torture/ still passed.
  #
  # Gated to `main` pushes only, not `pull_request` or every branch push: the
  # Makefile's own `torture` target comment says "This target is a manual
  # gate. No CI job runs it, and none should" because a run pulls ~2.5 GB of
  # container images across twenty containers — the cost that comment weighs
  # against a pull request's minutes. A push to `main` is rare enough, and
  # important enough (it is what a release tag is gated on below and in
  # docs/RUNBOOK.md), to carry that cost; a PR still does not.
  torture:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: docker is available
        run: docker version
      - name: torture (the ten real schemas, testdata/regressions/)
        run: make torture

  # ADR-002's second enforcement mechanism: docs/FLAGS.md, docs/KEYBINDINGS.md
  # and docs/ERRORS.md are tools/docgen output and must never be hand-edited
  # (docs/CLAUDE.md); this job is what makes that true rather than only
  # written down. `make docs-check` regenerates into a temporary directory —
  # never overwriting the tree a checkout of this job has — and prints a
  # unified diff plus the regeneration command on drift
  # (docs/adr/008-first-run.md §8, lazydocker's behaviour rather than
  # lazygit's bare `git diff --quiet`).
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: docs/FLAGS.md, docs/KEYBINDINGS.md, docs/ERRORS.md and README.md's flag table match tools/docgen
        run: make docs-check
      # T-0303: mask/words_corpus.go is generated from the two Census CSVs
      # tools/names/ already carries, so this needs no network the same way
      # docs-check above does not — offline, like the rest of this job.
      - name: mask/words_corpus.go matches tools/names
        run: make names-check

  # CONCEPT.md's enforcement list, ARCHITECTURE.md section 8: the registered
  # flag set — not source identifiers, which `forbidden` above already covers
  # — carries nothing named `--no-mask`, `--disable-mask` or `--skip-mask`,
  # and no flag widens `unmask` past the exact per-column
  # `--unmask TABLE.COL=REASON` opt-out.
  unsafe-flags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: no registered flag turns masking off or widens --unmask
        run: make unsafe-flags

  # THREAT_MODEL.md T10: "Every dependency pinned exactly; go.sum verified;
  # govulncheck in CI; dependency bumps are their own pull requests with the
  # reason." Marked "v1 but not blocking" there, but a job that does not fail
  # the build is a job nobody reads (ci.yml's own `continue-on-error` note,
  # above, on the integration job) — this one fails like every other.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: install the pinned govulncheck
        run: make tools
      - name: no known-reachable vulnerability in either module (THREAT_MODEL.md T10)
        run: make vulncheck

  # T-PERF (docs/PERF.md): BenchmarkExtractThroughput against no database, so
  # this job needs no Docker service and runs on every push like `test`
  # above, not only on a push to main like `torture`. It is meant to fail a
  # pull request whose change drops extract's own throughput by more than
  # BENCH_REGRESSION_PCT (Makefile, 20%) from the baseline recorded in
  # internal/extract/testdata/bench/baseline.json — not top-level
  # testdata/bench/, which was outside T-PERF's authorized paths (docs/PERF.md's
  # concerns section, tracker T-0175).
  #
  # A single recorded baseline cannot be a blocking gate on a shared runner:
  # T-0177 (2026-09-15) recorded one from this job's own runner (CI run
  # 34927703066, 10,865,118 rows/sec) and made the job blocking against it;
  # the very next run, with identical code, measured 6,741,072 rows/sec (CI
  # run 34928141791) — a 38% swing on the same commit, well past the 20%
  # ceiling either way. So this job now runs two checks with two different
  # jobs to do:
  #
  #   - `make bench-compare` is the regression gate. It benchmarks BENCH_BASE
  #     and the working tree back-to-back, interleaved, on this same runner
  #     in this same invocation, so runner noise lands on both sides of the
  #     comparison instead of only on whichever commit happened to run while
  #     a neighbour was busy. On a push, BENCH_BASE defaults to the
  #     Makefile's HEAD~1 ("did this commit regress it"); on a pull_request,
  #     it is set to the PR's base branch (fetched below as a
  #     remote-tracking ref, since a shallow PR checkout does not otherwise
  #     carry it), so a PR is compared against what it is proposing to merge
  #     into rather than only its own latest commit.
  #   - `make bench` stays the absolute, single-number check, but
  #     baseline.json now records a catastrophic-regression floor
  #     (3,000,000 rows/sec) rather than a number measured on one run and
  #     asked to tolerate the next — see that file's own note for why. It
  #     only fails when throughput has collapsed, not on runner-to-runner
  #     variance.
  #
  # Both steps stay blocking; docs/PERF.md's CI section has the fuller
  # account, including the two measured numbers above.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: fetch the pull request's base branch (bench-compare's BENCH_BASE)
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin '${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}'
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: extract throughput has not dropped from BENCH_BASE by more than BENCH_REGRESSION_PCT, measured back-to-back on this runner
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            make bench-compare BENCH_BASE=origin/${{ github.base_ref }}
          else
            make bench-compare
          fi
      - name: extract throughput has not collapsed below the catastrophic floor (internal/extract/testdata/bench/baseline.json)
        run: make bench
