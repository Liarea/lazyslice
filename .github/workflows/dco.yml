name: dco
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit carries a Developer Certificate of Origin sign-off
        run: |
          set -e
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=$(git log --format='%H %s' "$base..$head" --no-merges | while read -r sha subject; do
            git show -s --format=%B "$sha" | grep -q '^Signed-off-by: ' || echo "$sha $subject"
          done)
          if [ -n "$missing" ]; then
            echo "Commits without Signed-off-by (use git commit -s):"; echo "$missing"; exit 1
          fi
