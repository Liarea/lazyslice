name: release

on:
  push:
    tags:
      # The tool's own tags. The mask module releases on mask/v* and is not
      # built into a binary, so it is not this workflow's business (ADR-006).
      - "v*"

permissions:
  contents: write
  # id-token is required for cosign keyless signing (THREAT_MODEL.md T10): the
  # OIDC token of this workflow is the signing identity, and .goreleaser.yaml
  # signs the checksum file with it.
  id-token: write
  # actions: read is for the gate below, which reads the ci workflow's own
  # run history through the REST API rather than through a git checkout.
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # T-0140: docs/reviews/2026-09-09/REVIEW.md, "Release reality" — this
      # workflow ran `make check` only, so a tag did not have to point at a
      # commit whose `ci` workflow (lint, forbidden, unsafe-flags, the full
      # integration matrix, and since T-0140 also torture) had ever run, let
      # alone passed. `make check` below is still real and still required —
      # it is the gate for a tag pushed on an unpushed branch, or racing a
      # branch push, per its own comment in ci.yml — but it is not `ci`, and
      # it does not run torture. This step is the first thing the workflow
      # does, before checkout, so a red or missing `ci` run on this exact sha
      # fails the release before anything is built, signed or published.
      #
      # `head_sha` filters the ci workflow's own run list to this commit
      # (github.sha is the tag's target commit, not the tag itself). A commit
      # can carry more than one completed run of `ci` — a branch push and a
      # pull request both trigger it — but only a push-to-`main` run runs the
      # `torture` job (ci.yml: `if: github.ref == 'refs/heads/main' &&
      # github.event_name == 'push'`); a `pull_request` run, or a push to any
      # other branch, skips that job, and a skipped job still leaves the
      # workflow run's own conclusion as `success`. So the query below is
      # restricted server-side to `event=push&branch=main`, and the jq select
      # re-checks both fields rather than trusting the filter alone, so this
      # only ever counts the run kind that actually exercises torture.
      - name: refuse to release unless ci succeeded on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="${{ github.sha }}"
          runs=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${sha}&status=completed&event=push&branch=main" --jq '.workflow_runs')
          total=$(echo "$runs" | jq 'length')
          if [ "$total" -eq 0 ]; then
            echo "release: no completed 'ci' run on main found for commit $sha."
            echo "docs/RUNBOOK.md, 'Cutting a release': tag only a commit whose ci run on main is green."
            exit 1
          fi
          succeeded=$(echo "$runs" | jq '[.[] | select(.conclusion == "success" and .event == "push" and .head_branch == "main")] | length')
          if [ "$succeeded" -eq 0 ]; then
            echo "release: $total completed 'ci' run(s) on main found for commit $sha, and none of them succeeded."
            exit 1
          fi
          echo "release: ci succeeded on main for commit $sha ($succeeded of $total completed run(s))."

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # `make check` and not two `go test` lines. A tag is not required to
      # point at a commit ci.yml ever ran — a tag on an unpushed branch, or a
      # branch and its tag pushed in one operation with this workflow winning
      # the race — so the artefact that actually reaches users has to carry the
      # same gate a branch push does. That gate is lint, the forbidden-name
      # grep and the raced tests in both modules, which is what `make check`
      # is. The forbidden grep in particular is CLAUDE.md's hardest rule (no
      # name that turns masking off) and it was not running here at all.
      - name: the pinned build tools
        run: make tools

      - name: the same gate a branch push gets, before anything is published
        run: make check

      - uses: sigstore/cosign-installer@v4

      # syft, for the sboms pipe in .goreleaser.yaml (THREAT_MODEL.md T10's
      # "published SBOM"). goreleaser shells out to it rather than generating
      # one itself; `make snapshot` skips the pipe with --skip=sbom precisely
      # so nothing but this workflow needs syft on its PATH.
      - uses: anchore/sbom-action/download-syft@v0.24.2

      # The version here must equal Makefile's GORELEASER_VERSION, which is
      # what `make tools`, `make snapshot` and ci.yml's release-config job all
      # use. The action takes a literal, so this is the one place the pin is
      # repeated: bump both in the same pull request, or the tag builds with a
      # goreleaser no pull request ever validated the config against.
      # Release notes come from the commit bodies since the previous tag
      # (tools/relnotes/relnotes.py; every task commit carries release-note
      # bullets, .claude/skills/lazyslice-commit), not from goreleaser's list of
      # subjects. --release-notes makes goreleaser use the file verbatim.
      - name: release notes from the commits since the previous tag
        run: |
          prev=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || git rev-list --max-parents=0 HEAD)
          python3 tools/relnotes/relnotes.py "$prev" "${{ github.ref_name }}" > /tmp/relnotes.md
          echo "release notes: from $prev to ${{ github.ref_name }}, $(wc -l < /tmp/relnotes.md) lines"
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.0 # keep equal to Makefile's GORELEASER_VERSION
          args: release --clean --release-notes /tmp/relnotes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The tap is another repository, so publishing the cask needs a
          # credential this one does not have. HOMEBREW_TAP_TOKEN is the
          # repository secret that exists.
          #
          # THREAT_MODEL.md T10's third control reads "no long-lived tokens in
          # repository secrets", and this line is that control knowingly unmet:
          # HOMEBREW_TAP_TOKEN is a scoped PAT with write access to
          # Liarea/homebrew-tap. T10 itself has not been amended, so the threat
          # model and this file disagree until it is — a tracker item in front
          # of gate 4, not a thing to leave to a reader of one YAML comment.
          #
          # An earlier version of this job minted an installation token from a
          # GitHub App on Liarea/homebrew-tap — the credential T10 prefers,
          # because it expires with the job. The App was never
          # created: secrets.HOMEBREW_TAP_APP_ID was empty, the `if` skipped
          # the step, the token handed to goreleaser was empty,
          # .goreleaser.yaml's skip_upload rendered `true`, and goreleaser
          # skipped the cask with a log line and exited 0. Every tag published
          # binaries, published no cask, and reported success. Reversal
          # condition for going back: the App exists on Liarea/homebrew-tap and
          # both of its secrets are set, at which point restore the tap-token
          # step and delete this PAT.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # The skip is silent by design in goreleaser: with no tap credential the
      # cask pipe logs a line and the release still succeeds, which is the
      # right behaviour for the tool and the wrong one for a gate. Gate 3 says
      # `brew install` from the tap installs a binary that prints its version,
      # and a release that published no cask cannot meet it. So a release of a
      # non-prerelease tag that produced no uploaded cask fails the job, after
      # the binaries are up rather than instead of them.
      - name: a release tag must have published a cask
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          set -euo pipefail
          if [ ! -f dist/artifacts.json ]; then
            echo "release: goreleaser wrote no dist/artifacts.json"
            exit 1
          fi
          # A cask artifact exists whether or not it was uploaded; the config
          # goreleaser recorded alongside it is what says which. skip_upload
          # renders "true" exactly when HOMEBREW_TAP_TOKEN was empty.
          skipped=$(jq -r '
            [.[] | select(.type == "Homebrew Cask")
                 | .extra.BrewCaskConfig.skip_upload] | join(",")' dist/artifacts.json)
          if [ -z "$skipped" ]; then
            echo "release: goreleaser generated no Homebrew cask at all for ${{ github.ref_name }}."
            exit 1
          fi
          if [ "$skipped" != "auto" ] && [ "$skipped" != "false" ]; then
            echo "release: ${{ github.ref_name }} is not a prerelease tag, and the Homebrew cask was not"
            echo "published: goreleaser recorded skip_upload=\"$skipped\". That renders \"true\" when"
            echo "HOMEBREW_TAP_TOKEN is empty (.goreleaser.yaml), and the cask pipe then logs a line and"
            echo "exits 0 — the binaries are up and the tap has nothing new in it. Set the repository"
            echo "secret and re-run. Gate 3's 'brew install from your tap installs a binary that prints"
            echo "its version' cannot be met by this release."
            exit 1
          fi
          echo "release: the Homebrew cask was published (skip_upload=$skipped)"
