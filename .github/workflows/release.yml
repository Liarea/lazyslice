name: release

on:
  push:
    tags:
      # The tool's own tags. The mask module releases on mask/v* and is not
      # built into a binary, so it is not this workflow's business (ADR-006).
      - "v*"

permissions:
  contents: write
  # id-token is required for cosign keyless signing (THREAT_MODEL.md T10): the
  # OIDC token of this workflow is the signing identity, and .goreleaser.yaml
  # signs the checksum file with it.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Read at step level to decide whether a tap token can be minted at all.
      # A secrets expression cannot be used in an `if`, so it lands here first.
      HOMEBREW_TAP_APP_ID: ${{ secrets.HOMEBREW_TAP_APP_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: tests must pass before anything is published
        run: |
          go test -count=1 ./...
          (cd mask && go test -count=1 ./...)

      - uses: sigstore/cosign-installer@v4

      # The tap is another repository, so publishing the cask needs a credential
      # this one does not have. It is an installation token minted for this run
      # from a GitHub App installed on Liarea/homebrew-tap, and it expires with
      # the job: THREAT_MODEL.md T10 rules out a long-lived personal access
      # token in repository secrets, whose compromise publishes a formula
      # pointing at a binary CI never built.
      #
      # When the App is not configured the step is skipped, the token below is
      # empty, and .goreleaser.yaml skips the cask. The release itself still
      # publishes, and it publishes signed.
      - id: tap-token
        if: env.HOMEBREW_TAP_APP_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ env.HOMEBREW_TAP_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: Liarea
          repositories: homebrew-tap

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ steps.tap-token.outputs.token }}
