# goreleaser configuration for lazyslice.
#
# The binary is static and CGO-free (ADR-001), so one build stanza covers every
# platform and the artifacts are directly comparable.
#
# `make snapshot` runs this locally without publishing anything.

version: 2

project_name: lazyslice

before:
  hooks:
    - go mod download
    - go mod verify

builds:
  - id: lazyslice
    main: ./cmd/lazyslice
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .FullCommit }}
      - -X main.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: lazyslice
    ids: [lazyslice]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # `files` REPLACES goreleaser's default list (LICENSE*, README*, CHANGELOG*)
    # rather than adding to it, so LICENSE has to be named here. Apache-2.0
    # §4(a) requires every recipient of the work to get a copy of the licence,
    # and a released archive is a distribution: without this line every binary
    # published from this config ships without its own terms. A tag is
    # immutable, so this is fixed before the first one rather than in a
    # follow-up release. The CI release-config job asserts LICENSE is in the
    # archive.
    files:
      - LICENSE
      - README.md
      - SECURITY.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# One SPDX SBOM per archive (THREAT_MODEL.md T10's "published SBOM"), built by
# syft against the built artifact rather than declared by hand, so it lists
# what actually shipped rather than what go.mod says should have. The release
# workflow installs the pinned syft via anchore/sbom-action/download-syft
# before this step runs; a laptop running `make snapshot` does not need it
# installed, because that target passes `--skip=sbom`.
sboms:
  - id: archive
    artifacts: archive

# The mask module's tags (mask/vX.Y.Z, ROADMAP.md "Versioning and releases")
# are not versions of the tool: goreleaser reads the nearest tag as .Version,
# and once mask/v0.1.0 sat on a later commit than v0.1.0 the snapshot template
# below failed with "invalid semantic version" (CI's release-config job,
# 2026-09-22). Ignoring the pattern keeps .Version on the tool's own tags.
git:
  ignore_tags:
    - "mask/*"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# The Homebrew tap lives at github.com/Liarea/homebrew-tap. goreleaser
# deprecated formulae for binary releases in favour of casks, so this is a cask;
# `brew install Liarea/tap/lazyslice` is the same command either way.
homebrew_casks:
  - name: lazyslice
    ids: [lazyslice]
    repository:
      owner: Liarea
      name: homebrew-tap
      branch: main
      # Set by the release workflow from the repository secret of the same
      # name, which is the one credential that actually exists on
      # Liarea/lazyslice. An earlier version of the workflow minted an
      # installation token from a GitHub App and set this from its output; the
      # App was never created, so the secrets it read were empty, the token
      # here rendered empty, skip_upload below rendered `true`, and every tag
      # published binaries and silently no cask while reporting success.
      # THREAT_MODEL.md T10's argument against a long-lived personal access
      # token stands, and the App remains the better answer — but a workflow
      # that reads a credential nobody has set is worse than one that reads the
      # credential it has. Reversal: create the App on Liarea/homebrew-tap, set
      # HOMEBREW_TAP_APP_ID and HOMEBREW_TAP_APP_PRIVATE_KEY, restore the
      # tap-token step and delete the PAT.
      #
      # This field is not rendered by the usual template engine: the publish
      # pipe hands the raw string to goreleaser's ApplySingleEnvOnly, which
      # accepts the exact form `{{ .Env.NAME }}` and nothing else, so
      # envOrDefault here fails the release. `make snapshot` never reaches the
      # publish pipe, so the variable's absence locally does not matter.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/Liarea/lazyslice
    description: Snapshot a production SQL database into a safe local copy
    # "auto" keeps a pre-release tag out of the tap everyone installs from.
    # With no tap credential the cask is skipped outright: attempting the push
    # with an empty token fails the job after the GitHub release has already
    # been created, and a half-published tag is the worst of the three
    # outcomes.
    skip_upload: '{{ if eq (envOrDefault "HOMEBREW_TAP_TOKEN" "") "" }}true{{ else }}auto{{ end }}'
    # Gatekeeper. These binaries are cross-compiled on ubuntu-latest, unsigned
    # and un-notarized; cosign signs the checksum file, which Gatekeeper knows
    # nothing about. Homebrew applies com.apple.quarantine to everything it
    # stages, so without this the cask installs successfully and the first
    # `lazyslice --version` is killed or produces a Gatekeeper dialog — the
    # exact silent-ish failure Gate 3's "brew install from your tap installs a
    # binary that prints its version" exists to catch. goreleaser does not add
    # the workaround for you: its own cask template names "removing the macOS
    # quarantine attribute" as something the author puts in a hook
    # (goreleaser#5958). The CI release-config job asserts the generated cask
    # still has one.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/lazyslice"]
          end

# Keyless cosign signature over the checksum file, which names every artifact
# in the release, so one signature covers them all (THREAT_MODEL.md T10). The
# identity is the release workflow's OIDC token: there is no signing key to
# store, and nothing to rotate. Signing is skipped by `make snapshot`.
#
# One Sigstore bundle, checksums.txt.sigstore.json, holds the signature and
# the certificate together. cosign v3 writes that bundle by default and
# ignores --output-signature/--output-certificate, so the v2-era pair of
# flags failed v0.0.2 with "create bundle file: open : no such file or
# directory" (2026-09-22); this is goreleaser's own cosign-v3 shape. Verify:
#   cosign verify-blob --bundle checksums.txt.sigstore.json \
#     --certificate-identity-regexp '^https://github.com/Liarea/lazyslice/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     checksums.txt
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    output: true
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

release:
  draft: false
  # Until the tool does what CONCEPT.md promises, every tag is a pre-release.
  prerelease: true
  footer: |
    lazyslice is pre-release. It masks personal data by default and refuses to
    write to a target it did not create, but the stated false negatives in
    SECURITY.md apply to every snapshot it produces. Read them before you treat
    a snapshot as anonymous.
