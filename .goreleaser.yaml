# goreleaser configuration for lazyslice.
#
# The binary is static and CGO-free (ADR-001), so one build stanza covers every
# platform and the artifacts are directly comparable.
#
# `make snapshot` runs this locally without publishing anything.

version: 2

project_name: lazyslice

before:
  hooks:
    - go mod download
    - go mod verify

builds:
  - id: lazyslice
    main: ./cmd/lazyslice
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .FullCommit }}
      - -X main.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: lazyslice
    ids: [lazyslice]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - SECURITY.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# The Homebrew tap lives at github.com/Liarea/homebrew-tap. goreleaser
# deprecated formulae for binary releases in favour of casks, so this is a cask;
# `brew install Liarea/tap/lazyslice` is the same command either way.
homebrew_casks:
  - name: lazyslice
    ids: [lazyslice]
    repository:
      owner: Liarea
      name: homebrew-tap
      branch: main
      # Minted per run by the release workflow from a GitHub App installed on
      # the tap, so there is no long-lived token in repository secrets
      # (THREAT_MODEL.md T10). This field is not rendered by the usual template
      # engine: the publish pipe hands the raw string to goreleaser's
      # ApplySingleEnvOnly, which accepts the exact form `{{ .Env.NAME }}` and
      # nothing else, so envOrDefault here fails the release. `make snapshot`
      # never reaches the publish pipe, so the variable's absence locally does
      # not matter; on CI the workflow always sets it, empty when the App is
      # unconfigured, and skip_upload below stops publishing before the token
      # is read.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/Liarea/lazyslice
    description: Snapshot a production SQL database into a safe local copy
    # "auto" keeps a pre-release tag out of the tap everyone installs from.
    # With no tap credential the cask is skipped outright: attempting the push
    # with an empty token fails the job after the GitHub release has already
    # been created, and a half-published tag is the worst of the three
    # outcomes.
    skip_upload: '{{ if eq (envOrDefault "HOMEBREW_TAP_TOKEN" "") "" }}true{{ else }}auto{{ end }}'

# Keyless cosign signature over the checksum file, which names every artifact
# in the release, so one signature covers them all (THREAT_MODEL.md T10). The
# identity is the release workflow's OIDC token: there is no signing key to
# store, and nothing to rotate. Signing is skipped by `make snapshot`.
signs:
  - cmd: cosign
    artifacts: checksum
    certificate: "${artifact}.pem"
    output: true
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"

release:
  draft: false
  # Until the tool does what CONCEPT.md promises, every tag is a pre-release.
  prerelease: auto
  footer: |
    lazyslice is pre-release. It masks personal data by default and refuses to
    write to a target it did not create, but the stated false negatives in
    SECURITY.md apply to every snapshot it produces. Read them before you treat
    a snapshot as anonymous.
